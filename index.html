<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b6e9e">
<title>CRVT — Compte rendu de visite technique</title>
<style>
html,body{margin:0;padding:0;width:100%;min-height:100%;background:#f1f5f9}
#boot{padding:24px;font:16px Arial;color:#173247}
</style>
</head>
<body>
<div id="boot">Chargement de CRVT…</div>
<script>
(async()=>{
try{
 const r=await fetch('CRVT_DERNIERE_VERSION_VALIDEe_index-1.html?v=20261003-annot-v3',{cache:'no-store'});
 if(!r.ok)throw new Error('HTTP '+r.status);
 const s=await r.text();
 const doc=new DOMParser().parseFromString(s,'text/html');
 document.open();document.write(doc.documentElement.outerHTML);document.close();

 const css=document.createElement('style');
 css.id='crvt-annotation-v3';
 css.textContent=`
 .crvtNewAnnotOverlay{position:fixed!important;inset:0!important;width:100vw!important;height:100dvh!important;background:rgba(9,25,38,.97)!important;z-index:2147483647!important;display:flex!important;flex-direction:column!important;overflow:hidden!important;padding:0!important;margin:0!important;box-sizing:border-box!important;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif!important}
 html.crvtAnnotLock,body.crvtAnnotLock{overflow:hidden!important;height:100%!important;overscroll-behavior:none!important}
 body.crvtAnnotLock>header,body.crvtAnnotLock>#quickNav{display:none!important;visibility:hidden!important;pointer-events:none!important}
 .crvtAnnotHead{flex:0 0 auto;background:linear-gradient(135deg,#081b2c,#0b496b 55%,#13a9b8);color:#fff;padding:10px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px;box-shadow:0 3px 15px #0005;z-index:5}
 .crvtAnnotHead b{font-size:16px}.crvtAnnotHead span{font-size:11px;opacity:.82;display:block;margin-top:2px}.crvtAnnotClose{border:0;background:#fff;color:#173247;border-radius:12px;width:42px;height:42px;font-size:24px;font-weight:900;cursor:pointer;touch-action:manipulation}
 .crvtAnnotTools{flex:0 0 auto;background:#f7fafc;border-bottom:1px solid #cbd5e1;padding:8px;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:7px;max-height:34dvh;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;z-index:4}
 .crvtAnnotBtn,.crvtAnnotSelect{min-width:0;min-height:46px;border:1px solid #cbd5e1;border-radius:12px;background:#fff;color:#294052;font-weight:850;font-size:13px;padding:7px 6px;cursor:pointer;touch-action:manipulation;user-select:none;-webkit-tap-highlight-color:transparent}
 .crvtAnnotBtn.active{background:#e4f8fb;border-color:#14a7b8;box-shadow:0 0 0 2px #14a7b833;color:#075a82}
 .crvtAnnotBtn.danger{background:#fff1f2;border-color:#fecdd3;color:#b91c1c}.crvtAnnotBtn.primary{background:linear-gradient(135deg,#0b6e9e,#13a7b8);border-color:transparent;color:#fff}
 .crvtAnnotSelect{appearance:auto;padding-left:8px}
 .crvtAnnotCanvasArea{flex:1 1 auto;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#101820;padding:8px}
 .crvtAnnotCanvasBox{position:relative;max-width:100%;max-height:100%;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 35px #0008;background:#fff;touch-action:none}
 #crvtAnnotCanvas{display:block;max-width:100%;max-height:100%;width:auto;height:auto;touch-action:none;cursor:crosshair;background:#fff}
 .crvtAnnotHelp{flex:0 0 auto;background:#081b2c;color:#d8e8ef;padding:7px 10px;font-size:11px;line-height:1.35;text-align:center}
 .crvtAnnotActions{flex:0 0 auto;background:#f7fafc;padding:7px 8px;display:grid;grid-template-columns:1fr 1fr 1.2fr;gap:7px;border-top:1px solid #cbd5e1;z-index:5}
 @media(max-width:700px){.crvtAnnotTools{grid-template-columns:repeat(3,minmax(0,1fr));max-height:38dvh}.crvtAnnotBtn,.crvtAnnotSelect{min-height:48px;font-size:12px}.crvtAnnotHead{padding:8px 10px}.crvtAnnotHead b{font-size:14px}.crvtAnnotCanvasArea{padding:5px}.crvtAnnotActions{grid-template-columns:1fr 1fr 1.35fr}.crvtAnnotHelp{font-size:10px}}
 `;
 document.head.appendChild(css);

 function q(s){return document.querySelector(s)}
 function escHtml(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
 function imgLoad(src){return new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=reject;im.src=src;})}
 function cloneAnn(a){return JSON.parse(JSON.stringify(a||[]))}

 window.annotate=async function(sec,i){
   try{
     const photo=window.audit?.photos?.[sec]?.[i];
     if(!photo){toast('Photo introuvable');return}
     const src=photo.baseData||photo.data;
     if(!src){toast('Image introuvable');return}
     if(!photo.baseData)photo.baseData=photo.data;
     if(!Array.isArray(photo.annotations))photo.annotations=[];

     const im=await imgLoad(src);
     const max=1800;
     const scale=Math.min(1,max/im.naturalWidth||1,max/im.naturalHeight||1);
     const W=Math.max(1,Math.round(im.naturalWidth*scale));
     const H=Math.max(1,Math.round(im.naturalHeight*scale));
     const overlay=document.createElement('div');overlay.className='crvtNewAnnotOverlay';
     overlay.innerHTML=`
       <div class="crvtAnnotHead"><div><b>✏️ Annoter la photo</b><span>Photo ${i+1} • les annotations seront enregistrées dans le rapport</span></div><button type="button" class="crvtAnnotClose" id="caClose">×</button></div>
       <div class="crvtAnnotTools" id="caTools">
         <button type="button" class="crvtAnnotBtn active" data-tool="select">↖️ Sélection</button>
         <button type="button" class="crvtAnnotBtn" data-tool="draw">✏️ Dessin</button>
         <button type="button" class="crvtAnnotBtn" data-tool="arrow">↗️ Flèche</button>
         <button type="button" class="crvtAnnotBtn" data-tool="line">╱ Ligne</button>
         <button type="button" class="crvtAnnotBtn" data-tool="circle">⭕ Cercle</button>
         <button type="button" class="crvtAnnotBtn" data-tool="rect">▭ Rectangle</button>
         <button type="button" class="crvtAnnotBtn" data-tool="text">T Texte</button>
         <button type="button" class="crvtAnnotBtn active" data-style="solid">━ Plein</button>
         <button type="button" class="crvtAnnotBtn" data-style="dashed">╌ Pointillé</button>
         <select class="crvtAnnotSelect" id="caColor" aria-label="Couleur"><option value="#ef3340">🔴 Rouge</option><option value="#1479a6">🔵 Bleu</option><option value="#16a34a">🟢 Vert</option><option value="#f59e0b">🟠 Orange</option><option value="#111827">⚫ Noir</option><option value="#ffffff">⚪ Blanc</option></select>
         <button type="button" class="crvtAnnotBtn" id="caUndo">↶ Annuler</button>
         <button type="button" class="crvtAnnotBtn" id="caRedo">↷ Rétablir</button>
         <button type="button" class="crvtAnnotBtn" id="caDelete">🗑️ Supprimer</button>
         <button type="button" class="crvtAnnotBtn" id="caSmall">➖ Réduire</button>
         <button type="button" class="crvtAnnotBtn" id="caLarge">➕ Agrandir</button>
         <button type="button" class="crvtAnnotBtn danger" id="caClear">🧹 Tout effacer</button>
       </div>
       <div class="crvtAnnotCanvasArea"><div class="crvtAnnotCanvasBox"><canvas id="crvtAnnotCanvas" width="${W}" height="${H}"></canvas></div></div>
       <div class="crvtAnnotHelp">Sélection : touchez une annotation pour la déplacer. Flèche / ligne / cercle / rectangle : tracez avec le doigt. Texte : touchez l’image puis saisissez le texte.</div>
       <div class="crvtAnnotActions"><button type="button" class="crvtAnnotBtn" id="caCancel">✕ Annuler</button><button type="button" class="crvtAnnotBtn" id="caReset">↺ Réinitialiser</button><button type="button" class="crvtAnnotBtn primary" id="caSave">💾 Enregistrer</button></div>`;
     document.body.appendChild(overlay);
     document.documentElement.classList.add('crvtAnnotLock');document.body.classList.add('crvtAnnotLock');

     const canvas=overlay.querySelector('#crvtAnnotCanvas'),ctx=canvas.getContext('2d');
     let anns=cloneAnn(photo.annotations),history=[cloneAnn(anns)],histPos=0,tool='select',style='solid',color='#ef3340',selected=-1,drawing=null,drag=null;
     const pushHistory=()=>{history=history.slice(0,histPos+1);history.push(cloneAnn(anns));if(history.length>40)history.shift();histPos=history.length-1};
     const restore=()=>{anns=cloneAnn(history[histPos]||[]);selected=-1;drawAll();};
     const norm=(a)=>{const x=Math.min(a.x1,a.x2),y=Math.min(a.y1,a.y2),w=Math.abs(a.x2-a.x1),h=Math.abs(a.y2-a.y1);return{x,y,w,h}};
     function drawArrow(c,a){const ang=Math.atan2(a.y2-a.y1,a.x2-a.x1),len=Math.max(12,Math.min(34,Math.hypot(a.x2-a.x1,a.y2-a.y1)*.18));c.beginPath();c.moveTo(a.x2,a.y2);c.lineTo(a.x2-len*Math.cos(ang-.48),a.y2-len*Math.sin(ang-.48));c.moveTo(a.x2,a.y2);c.lineTo(a.x2-len*Math.cos(ang+.48),a.y2-len*Math.sin(ang+.48));c.stroke()}
     function setStroke(a){ctx.strokeStyle=a.color||'#ef3340';ctx.fillStyle=a.color||'#ef3340';ctx.lineWidth=a.size||Math.max(4,W/350);ctx.lineCap='round';ctx.lineJoin='round';ctx.setLineDash(a.style==='dashed'?[14,10]:[])}
     function drawAnn(a,idx){setStroke(a);const sel=idx===selected; if(sel){ctx.save();ctx.strokeStyle='#14a7b8';ctx.lineWidth=Math.max(3,(a.size||4)+5);ctx.setLineDash([8,7]);const n=norm(a);ctx.strokeRect(n.x-8,n.y-8,Math.max(16,n.w+16),Math.max(16,n.h+16));ctx.restore();setStroke(a)}
       if(a.type==='draw'){ctx.beginPath();(a.points||[]).forEach((p,j)=>j?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.stroke()}
       else if(a.type==='line'){ctx.beginPath();ctx.moveTo(a.x1,a.y1);ctx.lineTo(a.x2,a.y2);ctx.stroke()}
       else if(a.type==='arrow'){ctx.beginPath();ctx.moveTo(a.x1,a.y1);ctx.lineTo(a.x2,a.y2);ctx.stroke();drawArrow(ctx,a)}
       else if(a.type==='circle'){const n=norm(a),cx=n.x+n.w/2,cy=n.y+n.h/2;ctx.beginPath();ctx.ellipse(cx,cy,Math.max(1,n.w/2),Math.max(1,n.h/2),0,0,Math.PI*2);ctx.stroke()}
       else if(a.type==='rect'){const n=norm(a);ctx.strokeRect(n.x,n.y,n.w,n.h)}
       else if(a.type==='text'){ctx.save();ctx.fillStyle=a.color||'#ef3340';ctx.font=`900 ${a.size||32}px Arial`;ctx.textBaseline='top';const lines=String(a.text||'').split('\n');lines.forEach((t,j)=>ctx.fillText(t,a.x,a.y+j*(a.size||32)*1.15));ctx.restore()}
       ctx.setLineDash([]);
     }
     function drawAll(){ctx.clearRect(0,0,W,H);ctx.drawImage(im,0,0,W,H);anns.forEach(drawAnn)}
     function pos(ev){const r=canvas.getBoundingClientRect();return{x:(ev.clientX-r.left)*W/r.width,y:(ev.clientY-r.top)*H/r.height}}
     function distPointSeg(p,a,b){const dx=b.x-a.x,dy=b.y-a.y,l=dx*dx+dy*dy;if(!l)return Math.hypot(p.x-a.x,p.y-a.y);let t=((p.x-a.x)*dx+(p.y-a.y)*dy)/l;t=Math.max(0,Math.min(1,t));return Math.hypot(p.x-(a.x+t*dx),p.y-(a.y+t*dy))}
     function hit(a,p){const pad=Math.max(18,a.size||5);if(a.type==='draw')return (a.points||[]).some((q,j)=>j?distPointSeg(p,(a.points||[])[j-1],q)<pad:false);if(a.type==='text')return p.x>=a.x-pad&&p.x<=a.x+(a.text||'').length*(a.size||32)*.65+pad&&p.y>=a.y-pad&&p.y<=a.y+(a.size||32)*1.3*(String(a.text||'').split('\n').length)+pad;const n=norm(a);if(a.type==='circle'){const cx=n.x+n.w/2,cy=n.y+n.h/2,rx=Math.max(1,n.w/2),ry=Math.max(1,n.h/2);const v=((p.x-cx)/rx)**2+((p.y-cy)/ry)**2;return Math.abs(v-1)<.25|| (p.x>=n.x-pad&&p.x<=n.x+n.w+pad&&p.y>=n.y-pad&&p.y<=n.y+n.h+pad&&v<1)}return p.x>=n.x-pad&&p.x<=n.x+n.w+pad&&p.y>=n.y-pad&&p.y<=n.y+n.h+pad}
     function setTool(t){tool=t;overlay.querySelectorAll('[data-tool]').forEach(b=>b.classList.toggle('active',b.dataset.tool===t));canvas.style.cursor=t==='select'?'grab':t==='text'?'text':'crosshair'}
     overlay.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>setTool(b.dataset.tool));
     overlay.querySelectorAll('[data-style]').forEach(b=>b.onclick=()=>{style=b.dataset.style;overlay.querySelectorAll('[data-style]').forEach(x=>x.classList.toggle('active',x.dataset.style===style))});
     overlay.querySelector('#caColor').onchange=e=>color=e.target.value;
     overlay.querySelector('#caUndo').onclick=()=>{if(histPos>0){histPos--;restore()}};
     overlay.querySelector('#caRedo').onclick=()=>{if(histPos<history.length-1){histPos++;restore()}};
     overlay.querySelector('#caDelete').onclick=()=>{if(selected>=0){anns.splice(selected,1);selected=-1;pushHistory();drawAll()}};
     function resizeSelected(f){if(selected<0)return;const a=anns[selected],c=(a.size||5)*f;a.size=Math.max(2,Math.min(120,c));pushHistory();drawAll()}
     overlay.querySelector('#caSmall').onclick=()=>resizeSelected(.8);overlay.querySelector('#caLarge').onclick=()=>resizeSelected(1.25);
     overlay.querySelector('#caClear').onclick=()=>{if(anns.length&&!confirm('Supprimer toutes les annotations de cette photo ?'))return;anns=[];selected=-1;pushHistory();drawAll()};
     function addText(p){const text=prompt('Texte à placer sur la photo :','');if(text===null||!text.trim())return;anns.push({type:'text',x:p.x,y:p.y,text:text.trim(),color,size:Math.max(24,W/35),style:'solid'});selected=anns.length-1;pushHistory();drawAll()}
     canvas.addEventListener('pointerdown',e=>{e.preventDefault();canvas.setPointerCapture?.(e.pointerId);const p=pos(e);if(tool==='text'){addText(p);return}if(tool==='select'){selected=-1;for(let k=anns.length-1;k>=0;k--){if(hit(anns[k],p)){selected=k;break}}if(selected>=0){drag={start:p,orig:cloneAnn(anns[selected])}}drawAll();return}drawing={start:p,last:p,points:[p]};});
     canvas.addEventListener('pointermove',e=>{if(!drawing&&!drag)return;e.preventDefault();const p=pos(e);if(drag){const a=anns[selected],o=drag.orig,dx=p.x-drag.start.x,dy=p.y-drag.start.y;a.x1=o.x1===undefined?undefined:o.x1+dx;a.y1=o.y1===undefined?undefined:o.y1+dy;a.x2=o.x2===undefined?undefined:o.x2+dx;a.y2=o.y2===undefined?undefined:o.y2+dy;a.x=o.x===undefined?undefined:o.x+dx;a.y=o.y===undefined?undefined:o.y+dy;if(o.points)a.points=o.points.map(q=>({x:q.x+dx,y:q.y+dy}));drawAll();return}drawing.last=p;drawing.points.push(p);drawAll();if(tool==='draw'){const temp={type:'draw',points:drawing.points,color,style,size:Math.max(4,W/350)};drawAnn(temp,-1)}else{const a={type:tool,x1:drawing.start.x,y1:drawing.start.y,x2:p.x,y2:p.y,color,style,size:Math.max(4,W/350)};drawAnn(a,-1)}});
     canvas.addEventListener('pointerup',e=>{if(drag){drag=null;pushHistory();return}if(!drawing)return;const d=drawing;drawing=null;const end=d.last;if(tool==='draw'){if(d.points.length>1)anns.push({type:'draw',points:d.points,color,style,size:Math.max(4,W/350)})}else{const dx=end.x-d.start.x,dy=end.y-d.start.y;if(Math.hypot(dx,dy)>4)anns.push({type:tool,x1:d.start.x,y1:d.start.y,x2:end.x,y2:end.y,color,style,size:Math.max(4,W/350)})}selected=anns.length-1;pushHistory();drawAll()});
     function close(){overlay.remove();document.documentElement.classList.remove('crvtAnnotLock');document.body.classList.remove('crvtAnnotLock')}
     overlay.querySelector('#caClose').onclick=close;overlay.querySelector('#caCancel').onclick=close;
     overlay.querySelector('#caReset').onclick=()=>{anns=cloneAnn(photo.annotations||[]);history=[cloneAnn(anns)];histPos=0;selected=-1;drawAll()};
     overlay.querySelector('#caSave').onclick=()=>{const out=document.createElement('canvas');out.width=W;out.height=H;const oc=out.getContext('2d');oc.drawImage(im,0,0,W,H);anns.forEach(a=>{ctx.save();drawAnnTo(oc,a);ctx.restore()});photo.data=out.toDataURL('image/jpeg',.9);photo.baseData=photo.baseData||src;photo.annotations=cloneAnn(anns);if(window.audit.status==='Terminé')window.audit.status='Brouillon';if(typeof window.save==='function')window.save();close();if(typeof window.render==='function')window.render();if(typeof window.updateQuickNav==='function')window.updateQuickNav();toast(anns.length?`${anns.length} annotation(s) enregistrée(s)`:'Photo enregistrée');};
     function drawAnnTo(c,a){const old=ctx;ctx=c;setStroke(a);if(a.type==='draw'){c.beginPath();(a.points||[]).forEach((p,j)=>j?c.lineTo(p.x,p.y):c.moveTo(p.x,p.y));c.stroke()}else if(a.type==='line'||a.type==='arrow'){c.beginPath();c.moveTo(a.x1,a.y1);c.lineTo(a.x2,a.y2);c.stroke();if(a.type==='arrow')drawArrow(c,a)}else if(a.type==='circle'){const n=norm(a);c.beginPath();c.ellipse(n.x+n.w/2,n.y+n.h/2,Math.max(1,n.w/2),Math.max(1,n.h/2),0,0,Math.PI*2);c.stroke()}else if(a.type==='rect'){const n=norm(a);c.strokeRect(n.x,n.y,n.w,n.h)}else if(a.type==='text'){c.save();c.fillStyle=a.color;c.font=`900 ${a.size||32}px Arial`;c.textBaseline='top';String(a.text||'').split('\n').forEach((t,j)=>c.fillText(t,a.x,a.y+j*(a.size||32)*1.15));c.restore()}ctx=old}
     drawAll();
   }catch(err){console.error(err);toast('Impossible d’ouvrir l’annotation : '+(err.message||err))}
 };

 const oldAnnot=window.annotate;
 // Notre nouvel éditeur est volontairement installé après le chargement de la version stable.
 console.log('CRVT annotation editor v3 chargé');
}catch(e){const b=document.getElementById('boot');if(b)b.textContent='Erreur de chargement CRVT : '+e.message;}
})();
</script>
</body>
</html>
