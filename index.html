<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b6e9e">
<title>CRVT — Compte rendu de visite technique</title>
<style>html,body{margin:0;padding:0;width:100%;min-height:100%;background:#f1f5f9}#boot{padding:24px;font:16px Arial;color:#173247}</style>
</head>
<body>
<div id="boot">Chargement de CRVT…</div>
<script>
(async()=>{
 try{
  const v='20261003-annot-v5';
  const r=await fetch('CRVT_DERNIERE_VERSION_VALIDEe_index-1.html?v='+v,{cache:'no-store'});
  if(!r.ok)throw new Error('HTTP '+r.status);
  const s=await r.text();
  const annotationScript='<scr'+'ipt src="crvt-annotation-v3.js?v='+v+'"></scr'+'ipt>';
  const html=s.replace(/<\/body>/i,annotationScript+'</body>');
  document.open();
  document.write(html);
  document.close();
 }catch(e){
  const b=document.getElementById('boot');
  if(b)b.textContent='Erreur de chargement CRVT : '+e.message;
 }
})();
</script>
</body>
</html>
