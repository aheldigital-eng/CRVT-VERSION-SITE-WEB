<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b6e9e">
<title>CRVT — Compte rendu de visite technique</title>
<style>
html,body{margin:0;padding:0;width:100%;min-height:100%;background:#f1f5f9}
#boot{padding:24px;font:16px Arial;color:#173247}
</style>
</head>
<body>
<div id="boot">Chargement de CRVT…</div>
<script>
(async()=>{
  try{
    const r=await fetch('CRVT_DERNIERE_VERSION_VALIDEe_index-1.html?v=20261003-annotfix2',{cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const s=await r.text();
    const doc=new DOMParser().parseFromString(s,'text/html');
    document.open();
    document.write(doc.documentElement.outerHTML);
    document.close();

    const style=document.createElement('style');
    style.id='crvt-annotation-mobile-fix-v2';
    style.textContent=`
      /* CRVT — annotation mobile : l'éditeur prend réellement tout l'écran */
      html.crvt-annotation-open,body.crvt-annotation-open{overflow:hidden!important}
      body.crvt-annotation-open>header,
      body.crvt-annotation-open>#quickNav{display:none!important!important;visibility:hidden!important;pointer-events:none!important}

      /* Le modal d'annotation doit passer AU-DESSUS du header et de la navigation */
      .crvt-annotation-overlay{
        position:fixed!important;inset:0!important;
        width:100vw!important;height:100dvh!important;
        max-width:none!important;max-height:none!important;
        margin:0!important;padding:10px!important;
        background:rgba(15,23,42,.96)!important;
        z-index:2147483647!important;
        display:block!important;overflow:hidden!important;
        box-sizing:border-box!important;
      }
      .crvt-annotation-overlay .modalbox{
        position:relative!important;width:100%!important;height:100%!important;
        max-width:none!important;max-height:none!important;min-height:0!important;
        margin:0!important;padding:0!important;
        display:flex!important;flex-direction:column!important;
        gap:8px!important;overflow:hidden!important;
      }

      /* Bandeau d'outils : toutes les commandes sont dans une zone dédiée,
         avec défilement interne si nécessaire, jamais derrière le header. */
      .crvt-annotation-overlay .tools,
      .crvt-annotation-tools{
        flex:0 0 auto!important;
        width:100%!important;max-width:none!important;
        max-height:48dvh!important;
        overflow-y:auto!important;overflow-x:hidden!important;
        display:grid!important;
        grid-template-columns:repeat(3,minmax(0,1fr))!important;
        gap:7px!important;
        padding:6px!important;margin:0!important;
        background:#f8fafc!important;border-radius:14px!important;
        box-sizing:border-box!important;
        align-content:start!important;
        -webkit-overflow-scrolling:touch!important;
        overscroll-behavior:contain!important;
        position:relative!important;z-index:2147483646!important;
      }
      .crvt-annotation-overlay .tools>* ,
      .crvt-annotation-tools>*{
        min-width:0!important;width:100%!important;margin:0!important;
        box-sizing:border-box!important;pointer-events:auto!important;
        touch-action:manipulation!important;position:relative!important;z-index:3!important;
      }
      .crvt-annotation-overlay .tools .btn,
      .crvt-annotation-tools .btn{
        min-height:50px!important;padding:9px 5px!important;
        font-size:14px!important;line-height:1.15!important;
        white-space:normal!important;cursor:pointer!important;
        border-radius:12px!important;
      }
      .crvt-annotation-overlay .tools select,
      .crvt-annotation-tools select{
        min-height:50px!important;width:100%!important;
        padding:8px 6px!important;font-size:14px!important;
        background:#fff!important;border-radius:12px!important;
      }
      .crvt-annotation-overlay .tools .btn.active,
      .crvt-annotation-tools .btn.active{
        outline:3px solid #0b6e9e!important;outline-offset:-3px!important;
        background:#e4f5fb!important;color:#075a82!important;
      }
      .crvt-annotation-overlay .canvaswrap{
        flex:1 1 auto!important;min-height:120px!important;
        width:100%!important;max-width:none!important;
        overflow:hidden!important;position:relative!important;
        background:#fff!important;border-radius:12px!important;
        z-index:1!important;display:flex!important;
        align-items:center!important;justify-content:center!important;
      }
      .crvt-annotation-overlay .canvaswrap canvas{
        max-width:100%!important;max-height:100%!important;
        width:auto!important;height:auto!important;
        touch-action:none!important;pointer-events:auto!important;
      }
      .crvt-annotation-overlay .small{flex:0 0 auto!important;max-height:70px!important;overflow:auto!important}
      @media(max-width:620px){
        .crvt-annotation-overlay{padding:8px!important}
        .crvt-annotation-overlay .tools,
        .crvt-annotation-tools{grid-template-columns:repeat(3,minmax(0,1fr))!important;max-height:48dvh!important}
      }
      @media(min-width:621px){
        .crvt-annotation-overlay .tools,
        .crvt-annotation-tools{grid-template-columns:repeat(6,minmax(0,1fr))!important;max-height:34dvh!important}
      }
    `;
    document.head.appendChild(style);

    function visible(el){
      if(!el)return false;
      const r=el.getBoundingClientRect(),cs=getComputedStyle(el);
      return cs.display!=='none' && cs.visibility!=='hidden' && parseFloat(cs.opacity||'1')>0 && r.width>0 && r.height>0;
    }

    function fixAnnotationUI(){
      const candidates=[...document.querySelectorAll('.modal')].filter(visible);
      let modal=candidates.find(m=>m.querySelector('.tools'))||null;
      let tools=modal?.querySelector('.tools')||null;

      /* Secours si la version source utilise le bandeau d'outils sans classe modal détectable. */
      if(!tools){
        const all=[...document.querySelectorAll('.tools')].filter(visible);
        tools=all.find(t=>/Rectangle|Texte|Annuler|Enregistrer/.test(t.innerText||''))||null;
        if(tools){
          modal=tools.closest('.modal')||tools.parentElement;
          tools.classList.add('crvt-annotation-tools');
        }
      }
      const open=!!tools && visible(tools);
      document.documentElement.classList.toggle('crvt-annotation-open',open);
      document.body.classList.toggle('crvt-annotation-open',open);
      if(!open)return;

      if(modal){
        modal.classList.add('crvt-annotation-overlay');
        modal.style.setProperty('position','fixed','important');
        modal.style.setProperty('inset','0','important');
        modal.style.setProperty('z-index','2147483647','important');
        modal.style.setProperty('width','100vw','important');
        modal.style.setProperty('height','100dvh','important');
        modal.style.setProperty('max-width','none','important');
        modal.style.setProperty('max-height','none','important');
        modal.style.setProperty('overflow','hidden','important');
      }

      document.querySelectorAll('header,#quickNav').forEach(el=>{
        el.style.setProperty('display','none','important');
        el.style.setProperty('visibility','hidden','important');
        el.style.setProperty('pointer-events','none','important');
      });

      tools.classList.add('crvt-annotation-tools');
      tools.style.setProperty('display','grid','important');
      tools.style.setProperty('overflow-y','auto','important');
      tools.style.setProperty('overflow-x','hidden','important');

      /* Rendre toutes les commandes réellement accessibles au toucher. */
      tools.querySelectorAll('button,.btn,select,input,label').forEach(el=>{
        el.style.setProperty('pointer-events','auto','important');
        el.style.setProperty('touch-action','manipulation','important');
      });
    }

    fixAnnotationUI();
    new MutationObserver(fixAnnotationUI).observe(document.body,{subtree:true,childList:true,attributes:true,attributeFilter:['style','class','hidden','aria-hidden']});
    setInterval(fixAnnotationUI,300);
  }catch(e){
    const b=document.getElementById('boot');
    if(b)b.textContent='Erreur de chargement CRVT : '+e.message;
  }
})();
</script>
</body>
</html>
