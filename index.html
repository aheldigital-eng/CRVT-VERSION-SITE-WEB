<script>
const stateKey="auditTerrainV3_current", listKey="auditTerrainV3_list";
const clients={
"BUMP":{domain:"bump-charge.com"},
"CAP'BORNE":{domain:"capbornes.fr"},
"FRESHMILE":{domain:"freshmile.com"},
"50FIVE":{domain:"50five.com"},
"TIME2PLUG":{domain:"time2plug.com"}
};
const ENSIO_LOGO='ensio-logo-transparent.png';
const common=[
["puissance","Puissance souscrite","select:3 kVA|6 kVA|9 kVA|12 kVA|15 kVA|18 kVA|24 kVA|36 kVA|Autre"],["compteur","Type de Compteur","select:Monophasé|Triphasé|Autre"],
["divisionnaire","Installation d’un tableau divisionnaire","select:Oui|Non"],["typeborne","Type de borne","select:Monophasé|Triphasé|Autre"],
["environnement","Environnement Borne","select:Extérieur|Intérieur|Autre"],["position","Positionnement de Borne","select:Sur mur|Sur pied|Autre"],
["distance","Distance (m)","text"],["typeCable","Type de câble","select:3G10|5G10"],["cablecom","Câble de communication","select:Oui|Non"]
];
const modules={
tableau:[
["place","Place disponible dans le tableau ?","select:Oui|Non"]
],
cheminement:[
["passage","Type de passage","select:Apparent|Vide sanitaire|Combles|Faux plafond|Autre"],
["protection","Type de passage / protection du câble","select:Tube IRL|Fourreau en tranchée|Goulotte intérieure|Autre"]
],
borne:[]
};
function fresh(){return {id:Date.now(),date:new Date().toISOString().slice(0,10),auditeur:"",donneur:"BUMP",typeVisite:"VTP",pdfTheme:"ensio",client:"",dossier:"",adresse:"",telephone:"",typeDossier:"Dossier technique",status:"Brouillon",createdAt:new Date().toISOString(),updatedAt:new Date().toISOString(),sections:{tableau:false,cheminement:false,borne:false,site:false,operations:false},data:{},checks:{},photos:{},notes:{},gps:null,signatureClient:"",signatureAuditeur:"",visitTemplate:"custom",autoSave:true}}
function formatDateFR(value){
  const s=String(value??"").trim();
  if(!s)return "";
  let m=s.match(/^(\d{4})-(\d{2})-(\d{2})(?:$|T)/);
  if(m)return `${m[3]}/${m[2]}/${m[1]}`;
  m=s.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
  if(m)return `${m[1]}/${m[2]}/${m[3]}`;
  return s;
}
function parseDateFR(value){const v=(value||"").trim();if(!v)return "";const m=v.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);if(!m)return null;const d=Number(m[1]),mo=Number(m[2]),y=Number(m[3]);const dt=new Date(y,mo-1,d);if(dt.getFullYear()!==y||dt.getMonth()!==mo-1||dt.getDate()!==d)return null;return `${String(y).padStart(4,"0")}-${String(mo).padStart(2,"0")}-${String(d).padStart(2,"0")}`;}
function normalizeDateInput(value){let digits=(value||"").replace(/\D/g,"").slice(0,8);if(digits.length>4)digits=digits.slice(0,2)+"/"+digits.slice(2,4)+"/"+digits.slice(4);else if(digits.length>2)digits=digits.slice(0,2)+"/"+digits.slice(2);return digits;}
const DB_NAME="auditTerrainV26DB",DB_VERSION=1,STORE="audits",CURRENT="current";
let dbPromise=null,historyCache=[];
let scrollSpyObserver=null;
function openDB(){
  if(dbPromise)return dbPromise;
  dbPromise=new Promise((resolve,reject)=>{
    const r=indexedDB.open(DB_NAME,DB_VERSION);
    r.onupgradeneeded=()=>{const db=r.result;if(!db.objectStoreNames.contains(STORE))db.createObjectStore(STORE,{keyPath:"id"});};
    r.onsuccess=()=>resolve(r.result); r.onerror=()=>reject(r.error);
  });
  return dbPromise;
}
function idbGet(id){return openDB().then(db=>new Promise((resolve,reject)=>{const tx=db.transaction(STORE,"readonly"),q=tx.objectStore(STORE).get(id);q.onsuccess=()=>resolve(q.result||null);q.onerror=()=>reject(q.error)}))}
function idbPut(obj){return openDB().then(db=>new Promise((resolve,reject)=>{const tx=db.transaction(STORE,"readwrite");tx.objectStore(STORE).put(obj);tx.oncomplete=()=>resolve(true);tx.onerror=()=>reject(tx.error)}))}
function idbDelete(id){return openDB().then(db=>new Promise((resolve,reject)=>{const tx=db.transaction(STORE,"readwrite");tx.objectStore(STORE).delete(id);tx.oncomplete=()=>resolve(true);tx.onerror=()=>reject(tx.error)}))}
function idbAll(){return openDB().then(db=>new Promise((resolve,reject)=>{const tx=db.transaction(STORE,"readonly"),q=tx.objectStore(STORE).getAll();q.onsuccess=()=>resolve(q.result||[]);q.onerror=()=>reject(q.error)}))}
function legacyAudit(){try{return JSON.parse(localStorage.getItem(stateKey)||"null")}catch(e){return null}}
let audit=legacyAudit()||fresh();
if(!audit.status)audit.status="Brouillon";
if(!audit.pdfTheme) audit.pdfTheme="ensio"; if(!audit.gps) audit.gps=null; if(audit.signatureClient===undefined)audit.signatureClient=""; if(audit.signatureAuditeur===undefined)audit.signatureAuditeur=""; if(!audit.visitTemplate)audit.visitTemplate="custom";
function esc(s=""){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
async function migrateStorage(){
  try{
    const current=legacyAudit();
    const legacyList=JSON.parse(localStorage.getItem(listKey)||"[]");
    if(current) await idbPut(current);
    if(Array.isArray(legacyList)) for(const item of legacyList) await idbPut(item);
    localStorage.removeItem(stateKey); localStorage.removeItem(listKey);
    historyCache=await idbAll();
  }catch(e){console.warn("Migration IndexedDB",e);}
}
function save(){
  audit.updatedAt=new Date().toISOString();
  idbPut(JSON.parse(JSON.stringify(audit))).catch(e=>{console.warn("Sauvegarde IndexedDB impossible",e);toast("La sauvegarde a échoué. Vérifie l’espace disponible sur l’appareil.");});
  return true;
}
function toast(t){let x=document.createElement("div");x.className="toast";x.textContent=t;document.body.appendChild(x);setTimeout(()=>x.remove(),1600)}
function field(key,label,type){
let v=audit.data[key]||"";
if(type.startsWith("select:")){
let opts=type.slice(7).split("|");
let isOther=opts.includes("Autre");
let otherKey=key+"Other";
return `<label>${label}</label><select data-field="${key}" data-has-other="${isOther}"><option value="">Sélectionner…</option>${opts.map(o=>`<option value="${esc(o)}" ${v===o?"selected":""}>${esc(o)}</option>`).join("")}</select>${isOther?`<div id="${key}OtherWrap" style="display:${v==="Autre"?"block":"none"};margin-top:7px"><input data-field="${otherKey}" value="${esc(audit.data[otherKey]||"")}" placeholder="Préciser…"></div>`:""}`;
}
return `<label>${label}</label>${type==="textarea"?`<textarea data-field="${key}" placeholder="Saisir les détails…">${esc(v)}</textarea>`:`<input data-field="${key}" value="${esc(v)}">`}`;
}
function photos(sec){
let arr=audit.photos[sec]||[];
return `<div class="photoGrid">${arr.map((p,i)=>`<div class="photo">
  <div class="photoIndex">PHOTO ${i+1}<span class="photoStatus ${p.annotations&&p.annotations.length?'':'empty'}">${p.annotations&&p.annotations.length?'✓ Annotée':'○ Non annotée'}</span></div>
  <img src="${p.data}" alt="Photo ${i+1}" style="transform:rotate(${Number(p.rotation||0)}deg);transform-origin:center center">
  <button type="button" class="photoZoomBtn noPrint" onclick="openPhotoViewer('${sec}',${i})">🔍 Agrandir la photo</button>
  <label class="photoCaptionLabel noPrint">Légende de la photo
    <input class="photoCaptionInput" value="${esc(p.caption||"")}" placeholder="Ex. Vue du tableau électrique" data-caption-sec="${sec}" data-caption-index="${i}">
  </label>
  <small class="printCaption">${esc(p.caption&&p.caption!=="Photo"?p.caption:`Photo ${i+1}`)}</small>
  <div class="row noPrint photoControls">
    <button class="btn secondary" onclick="annotate('${sec}',${i})">✏️ Annoter</button>
    <button class="btn outline" onclick="replacePhoto('${sec}',${i})">🔄 Remplacer</button>
    <button class="btn secondary" onclick="movePhoto('${sec}',${i},-1)" ${i===0?'disabled':''}>⬆️</button>
    <button class="btn secondary" onclick="movePhoto('${sec}',${i},1)" ${i===arr.length-1?'disabled':''}>⬇️</button>
    <button class="btn danger" onclick="removePhoto('${sec}',${i})">🗑️ Supprimer</button>
  </div>
</div>`).join("")}</div>
<div class="photoActions noPrint">
  <button type="button" class="btn primary" onclick="openPhotoPicker('${sec}','camera')">📷 Prendre une photo</button>
  <button type="button" class="btn secondary" onclick="openPhotoPicker('${sec}','gallery')">🖼️ Choisir dans la galerie</button>
</div>`;
}
function moduleCard(id,title){
let rows=modules[id];
return `<section class="card" id="sec-${id}"><span class="tag">${title}</span><h2>${title}</h2>
<div class="grid">${rows.map(r=>`<div class="${r[2]==="textarea"?"full":""}">${field(r[0],r[1],r[2])}</div>`).join("")}</div>
${id==="tableau" ? `<div id="tableauFollow" style="margin-top:12px"></div>` : ""}
${id==="cheminement" ? `<div id="cheminementFollow" style="margin-top:12px"></div>` : ""}
${id==="borne" ? `<div id="borneFollow" style="margin-top:12px"></div>` : ""}
<div style="margin-top:12px"><label>Observation / constat</label><textarea data-note="${id}" placeholder="Décrire le constat, la contrainte ou l’information importante…">${esc(audit.notes[id]||"")}</textarea></div>
</section>`;
}
function render(){
let h=`<section class="card" id="general"><span class="tag">AUDIT</span><h2>Informations générales</h2><div class="grid">
<div><label>Date de l’audit</label><input type="text" inputmode="numeric" maxlength="10" data-top="date" value="${formatDateFR(audit.date)}" placeholder="JJ/MM/AAAA" aria-label="Date de l’audit au format JJ/MM/AAAA"></div>
<div><label>Auditeur</label><input data-top="auditeur" value="${esc(audit.auditeur)}"></div>
<div class="full clientField">
<label>DONNEUR D’ORDRE</label>
<select data-top="donneur" id="donorSelect">${Object.keys(clients).map(c=>`<option value="${esc(c)}" ${audit.donneur===c?"selected":""}>${esc(c)}</option>`).join("")}</select>
<label style="margin-top:12px">TYPE DE VISITE</label>
<div class="visitTypeChoice" role="group" aria-label="Type de visite">
<button type="button" class="visitTypeBtn ${audit.typeVisite==="VTP"?"active":""}" data-visit-type="VTP">🏠 VTP<br><small>Visite technique physique</small></button>
<button type="button" class="visitTypeBtn ${audit.typeVisite==="VTV"?"active":""}" data-visit-type="VTV">💻 VTV<br><small>Visite technique virtuelle</small></button>
</div>
<label style="margin-top:12px">CLIENT FINAL</label>
<input data-top="client" value="${esc(audit.client)}" placeholder="Nom du client final">
</div></div>
</div></section>
<section class="card" id="infos"><span class="tag">INFORMATIONS</span><h2>Informations techniques</h2><div class="grid">
${common.map(r=>`<div>${field(r[0],r[1],r[2])}</div>`).join("")}<div class="full extraCommentForm" style="margin-top:12px"><label>COMMENTAIRE / INFORMATIONS COMPLÉMENTAIRES</label><textarea data-field="commentaire" placeholder="Ex. Travaux à la charge du client, contrainte particulière, précision importante…">${esc(audit.data.commentaire||"")}</textarea></div></div></section>
<section class="card" id="modules"><span class="tag">MODULES</span><h2>Contenu de l’audit</h2><p class="small">Coche uniquement les parties réellement présentes dans ce dossier. Les autres ne seront pas affichées dans le rapport.</p>
${Object.entries({tableau:"Tableau électrique",cheminement:"Cheminement du câble",borne:"Emplacement de la borne"}).map(([k,v])=>`<div class="item"><div class="itemhead"><b>${v}</b><button class="btn ${audit.sections[k]?"primary":"secondary"}" data-toggle="${k}">${audit.sections[k]?"✓ Activé":"Ajouter"}</button></div></div>`).join("")}</section>`;
if(audit.sections.tableau)h+=`<section id="tableau">${moduleCard("tableau","TABLEAU ÉLECTRIQUE")}</section>`;
if(audit.sections.cheminement)h+=`<section id="cheminement">${moduleCard("cheminement","CHEMINEMENT DU CÂBLE")}</section>`;
if(audit.sections.borne)h+=`<section id="borne">${moduleCard("borne","EMPLACEMENT DE LA BORNE")}</section>`;

function setupScrollSpy(){
  if(scrollSpyObserver){ scrollSpyObserver.disconnect(); scrollSpyObserver=null; }
  const nav=document.getElementById("quickNav");
  if(!nav) return;
  const buttons=[...document.querySelectorAll("[data-jump]")];
  const sections=buttons.map(b=>document.getElementById(b.dataset.jump)).filter(Boolean);
  if(!sections.length) return;
  const setActive=(id)=>{
    buttons.forEach(b=>b.classList.toggle("active",b.dataset.jump===id));
    const active=buttons.find(b=>b.dataset.jump===id);
    // Défilement horizontal de la barre uniquement : ne jamais toucher au scroll vertical de la page.
    if(active){
      const inner=nav.querySelector(".quickNavInner");
      if(inner){
        const left=active.offsetLeft - Math.max(0,(inner.clientWidth-active.offsetWidth)/2);
        inner.scrollTo({left:Math.max(0,left),behavior:"smooth"});
      }
    }
  };
  scrollSpyObserver=new IntersectionObserver(entries=>{
    const visible=entries.filter(e=>e.isIntersecting).sort((a,b)=>b.intersectionRatio-a.intersectionRatio);
    if(visible[0]) setActive(visible[0].target.id);
  },{root:null,rootMargin:"-20% 0px -55% 0px",threshold:[0,.15,.35,.6]});
  sections.forEach(sec=>scrollSpyObserver.observe(sec));
}

function addPhoto(file,sec){
  if(!file || !file.type.startsWith("image/")) return;
  const r=new FileReader();
  r.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      const max=1800;
      let w=img.naturalWidth,h=img.naturalHeight;
      if(w>max || h>max){
        const ratio=Math.min(max/w,max/h); w=Math.round(w*ratio); h=Math.round(h*ratio);
      }
      const c=document.createElement("canvas"); c.width=w;c.height=h;
      const ctx=c.getContext("2d"); ctx.drawImage(img,0,0,w,h);
      const data=c.toDataURL("image/jpeg",0.82);
      audit.photos[sec]??=[];
      audit.photos[sec].push({data,caption:"Photo",annotations:[],baseData:data,rotation:0});
      if(audit.status==="Terminé") audit.status="Brouillon";
      save(); render(); updateQuickNav();
    };
    img.onerror=()=>toast("Impossible de lire cette image.");
    img.src=r.result;
  };
  r.onerror=()=>toast("Impossible de charger la photo.");
  r.readAsDataURL(file);
}
function removePhoto(sec,i){
  const current=(audit.photos[sec]||[])[i];
  const hasAnn=current && current.annotations && current.annotations.length;
  const msg=hasAnn?`Cette photo contient ${current.annotations.length} annotation(s). Supprimer la photo et toutes ses annotations ?`:`Supprimer la photo ${i+1} ?`;
  if(!confirm(msg)) return;
  audit.photos[sec].splice(i,1);
  if(audit.status==="Terminé") audit.status="Brouillon";

}

function getSynthesis(){
  const moduleNames={tableau:"Tableau électrique",cheminement:"Cheminement du câble",borne:"Emplacement de la borne"};
  const active=Object.keys(moduleNames).filter(k=>audit.sections[k]);
  const photoTotal=Object.values(audit.photos||{}).reduce((a,b)=>a+(Array.isArray(b)?b.length:0),0);
  const annotated=Object.values(audit.photos||{}).reduce((a,b)=>a+(Array.isArray(b)?b.filter(p=>p.annotations&&p.annotations.length).length:0),0);
  const warnings=validateAudit().filter(x=>x.type==='warning');
  const errors=validateAudit().filter(x=>x.type==='error');
  const observations=[];
  if((audit.data.commentaire||'').trim()) observations.push(audit.data.commentaire.trim());
  active.forEach(k=>{ if((audit.notes?.[k]||'').trim()) observations.push(`${moduleNames[k]} : ${audit.notes[k].trim()}`); });
  let status=errors.length?'À corriger':warnings.length?'À vérifier':'Prêt';
  return {moduleNames,active,photoTotal,annotated,warnings,errors,observations,status};
}

async function saveAudit(){
  audit.updatedAt=new Date().toISOString();
  try{
    await idbPut(JSON.parse(JSON.stringify(audit)));
    historyCache=await idbAll();
    const st=document.getElementById("saveState");
    if(st){ const d=new Date(audit.updatedAt); st.textContent=`✓ Sauvegardé à ${d.toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"})}`; st.className="saveState"; }
    toast("Audit enregistré"); history();
    return true;
  }catch(e){toast("Impossible d’enregistrer l’audit. Vérifie l’espace disponible sur l’appareil.");return false;}
}
async function finishAudit(){
  const items=validateAudit();
  const errors=items.filter(x=>x.type==='error');
  if(errors.length){toast("Corrige d’abord les informations obligatoires.");preReport();return;}
  audit.status="Terminé"; await saveAudit(); render();
}
function auditFileName(a){
  const client=String(a?.client||"audit").trim().replace(/[^a-zA-Z0-9À-ÿ_-]+/g,"-").replace(/^-+|-+$/g,"")||"audit";
  const id=String(a?.id||Date.now()).slice(-6);
  return `Audit-${client}-${id}.json`;
}
function auditBlob(a){
  const copy=JSON.parse(JSON.stringify(a));
  return new Blob([JSON.stringify(copy,null,2)],{type:"application/json"});
}
function downloadAuditFile(a){
  const blob=auditBlob(a), url=URL.createObjectURL(blob), link=document.createElement("a");
  link.href=url; link.download=auditFileName(a); document.body.appendChild(link); link.click(); link.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1500);
}
function reportFileName(a){
  const client=String(a?.client||"audit").trim().replace(/[^a-zA-Z0-9À-ÿ_-]+/g,"-").replace(/^-+|-+$/g,"")||"audit";

function downloadReportFile(a,html){

  link.href=url; link.download=reportFileName(a); document.body.appendChild(link); link.click(); link.remove();

function buildReportHtmlForAudit(a){
  const previous=audit;
  audit=JSON.parse(JSON.stringify(a));
  try{return report(false)}finally{audit=previous;}
}
async function shareAuditObject(a){
  if(!a)return;
  try{
    const html=buildReportHtmlForAudit(a);
    if(!html)throw new Error("Rapport HTML indisponible");
    const file=new File([html],reportFileName(a),{type:"text/html"});
    if(navigator.share && navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({title:`Compte-rendu d’audit ${a.client||"Terrain"}`,text:`Compte-rendu d’audit terrain ${a.client||""}`.trim(),files:[file]});
      toast("Compte-rendu partagé"); return;
    }
    downloadReportFile(a,html); toast("Partage direct indisponible : rapport HTML exporté");
  }catch(e){
    if(e && e.name==="AbortError")return;
    console.error(e);
    try{
      const html=buildReportHtmlForAudit(a);
      if(html){downloadReportFile(a,html);toast("Compte-rendu HTML exporté");return;}
    }catch(_){ }
    toast("Impossible de préparer le compte-rendu à partager");
  }
}
async function shareCurrentAudit(){
  try{ await saveAudit(); await shareAuditObject(audit); }
  catch(e){
    try{const html=buildReportHtmlForAudit(audit); if(html)downloadReportFile(audit,html);}
    catch(_){downloadAuditFile(audit);}
  }
}

async function importBackupFile(input){
  const file=input.files&&input.files[0];
  input.value="";
  if(!file)return;
  try{
    const text=await file.text();
    const payload=JSON.parse(text);
    if(!payload || payload.app!=="Audit Terrain" || !Array.isArray(payload.audits)){
      throw new Error("Format de sauvegarde invalide");
    }
    const valid=payload.audits.filter(x=>x && Number.isFinite(Number(x.id)) && typeof x==="object");
    if(!valid.length){toast("Aucun audit valide trouvé dans la sauvegarde.");return;}
    const ok=confirm(`Importer ${valid.length} audit(s) ?\\n\\nLes audits ayant le même numéro seront remplacés par la version importée.`);
    if(!ok)return;
    for(const item of valid){
      const copy=JSON.parse(JSON.stringify(item));
      if(!copy.updatedAt)copy.updatedAt=new Date().toISOString();
      if(!copy.createdAt)copy.createdAt=copy.updatedAt;
      if(!copy.status)copy.status="Brouillon";
      await idbPut(copy);
    }
    historyCache=await idbAll();
    toast(`${valid.length} audit(s) importé(s)`);
    history();
  }catch(e){
    console.error(e);
    toast("Fichier de sauvegarde invalide ou illisible.");
  }
}
async function history(){
  const el=document.getElementById("hist");
  if(!el)return;
  try{historyCache=await idbAll();}catch(e){}
  const q=(document.getElementById("historySearch")?.value||"").trim().toLowerCase();
  const statusFilter=document.getElementById("historyStatus")?.value||"Tous";
  const sort=document.getElementById("historySort")?.value||"recent";
  const from=document.getElementById("historyFrom")?.value||"";
  const to=document.getElementById("historyTo")?.value||"";
  let a=historyCache.slice();
  if(q){
    a=a.filter(x=>{
      const photos=Object.values(x.photos||{}).flat().map(p=>p?.caption||"").join(" ");
      const hay=[x.id,x.client,x.auditeur,x.typeVisite,x.date,x.status,photos,...Object.values(x.notes||{})].join(" ").toLowerCase();
      return hay.includes(q);
    });
  }
  if(statusFilter!=="Tous")a=a.filter(x=>(x.status||"Brouillon")===statusFilter);
  if(from)a=a.filter(x=>String(x.date||"").slice(0,10)>=from);
  if(to)a=a.filter(x=>String(x.date||"").slice(0,10)<=to);
  a.sort((x,y)=>{
    if(sort==="client")return String(x.client||"").localeCompare(String(y.client||""),"fr",{sensitivity:"base"});
    const dx=new Date(x.updatedAt||0).getTime(),dy=new Date(y.updatedAt||0).getTime();
    return sort==="oldest"?dx-dy:dy-dx;
  });
  const all=historyCache;
  const done=all.filter(x=>(x.status||"Brouillon")==="Terminé").length;
  const drafts=all.length-done;
  const sum=document.getElementById("historySummary");
  if(sum)sum.innerHTML=`<span class="historyChip">📁 ${all.length} audit${all.length>1?"s":""}</span><span class="historyChip">🟢 ${done} terminé${done>1?"s":""}</span><span class="historyChip">📝 ${drafts} brouillon${drafts>1?"s":""}</span><span class="historyChip">🔎 ${a.length} affiché${a.length>1?"s":""}</span>`;
  if(!a.length){el.innerHTML=`<div class="historyEmpty">${all.length?"Aucun audit ne correspond aux critères de recherche.":"Aucun audit enregistré pour le moment."}</div>`;return;}
  el.innerHTML=a.slice(0,50).map(x=>{
    const photos=Object.values(x.photos||{}).reduce((n,v)=>n+(v||[]).length,0);
    const status=x.status||"Brouillon";
    const dt=x.updatedAt?new Date(x.updatedAt).toLocaleString("fr-FR",{dateStyle:"short",timeStyle:"short"}):formatDateFR(x.date);
    return `<div class="item"><div class="historyMeta"><b>${esc(x.client||"Sans nom")}</b><span class="statusBadge ${status==="Terminé"?"done":""}">${esc(status)}</span></div><div class="smallMuted">Audit #${esc(String(x.id).slice(-6))} · ${esc(formatDateFR(x.date||""))} · ${esc(x.auditeur||"Non renseigné")} · ${photos} photo(s) · modifié ${esc(dt)}</div><div class="row noPrint" style="margin-top:8px"><button class="btn secondary" onclick="loadAudit(${x.id})">Ouvrir</button><button class="btn secondary" onclick="shareSavedAudit(${x.id})">📤 Partager</button><button class="btn secondary" onclick="duplicateAudit(${x.id})">Dupliquer</button><button class="btn danger" onclick="deleteAudit(${x.id})">Supprimer</button></div></div>`;
  }).join("");
}

function validateAudit(){
  const items=[];
  const add=(type,text,detail="")=>items.push({type,text,detail});
  if(!audit.client.trim()) add("error","Client non renseigné","Renseigne le client avant de générer le rapport.");
  if(!audit.date) add("error","Date de l’audit manquante","Renseigne la date de l’audit.");
  if(!audit.auditeur.trim()) add("error","Auditeur non renseigné","Renseigne le nom de l’auditeur.");
  if(!Object.values(audit.sections).some(Boolean)) add("error","Aucun module sélectionné","Active au moins une partie de l’audit.");

  if(audit.sections.tableau){
    if(!audit.data.place) add("warning","Tableau électrique : décision manquante","Indique si une place est disponible dans le tableau.");
    if(audit.data.place && !(audit.photos.tableau||[]).length) add("warning","Tableau électrique : aucune photo","Une photo du tableau peut être utile pour justifier le constat.");
  }
  if(audit.sections.cheminement){
    if(!audit.data.passage) add("warning","Cheminement : type de passage manquant","Renseigne le type de passage.");
    if(!audit.data.protection) add("warning","Cheminement : protection manquante","Renseigne la protection / le type de passage du câble.");
    if(!(audit.photos.cheminement||[]).length) add("warning","Cheminement : aucune photo","Ajoute au moins une photo si le cheminement doit être documenté.");
  }
  if(audit.sections.borne && !(audit.photos.borne||[]).length) add("warning","Emplacement de la borne : aucune photo","Ajoute une photo de l’emplacement si possible.");

  const pos=(audit.data.position||"").toLowerCase();
  const allNotes=Object.values(audit.notes||{}).join(" ").toLowerCase();
  if(pos.includes("pied") && /\bmur\b/.test(allNotes)) add("warning","Contradiction possible : borne sur pied / borne sur mur","Le positionnement indique « Sur pied », mais une observation mentionne « mur ».");
  if(pos.includes("mur") && /\bpied\b/.test(allNotes)) add("warning","Contradiction possible : borne sur mur / borne sur pied","Le positionnement indique « Sur mur », mais une observation mentionne « pied ».");

  return items;
}
function validationTarget(item){
  const t=item.text.toLowerCase();
  if(t.includes('client non renseigné')) return {selector:'[data-top="client"]'};
  if(t.includes('date de l’audit')) return {selector:'[data-top="date"]'};
  if(t.includes('auditeur non renseigné')) return {selector:'[data-top="auditeur"]'};
  if(t.includes('aucun module sélectionné')) return {selector:'[data-toggle]'};
  if(t.includes('tableau électrique : décision')) return {selector:'[data-field="place"]'};
  if(t.includes('tableau électrique : aucune photo')) return {selector:'#tableauFollow'};
  if(t.includes('cheminement : type de passage')) return {selector:'[data-field="passage"]'};
  if(t.includes('cheminement : protection')) return {selector:'[data-field="protection"]'};
  if(t.includes('cheminement : aucune photo')) return {selector:'#cheminementFollow'};
  if(t.includes('emplacement de la borne : aucune photo')) return {selector:'#borneFollow'};
  if(t.includes('contradiction possible')) return {selector:'[data-field="position"]'};
  return null;
}
function focusValidationTarget(item){
  const target=validationTarget(item);
  const overlay=document.querySelector('.validationOverlay');
  if(overlay) overlay.remove();
  if(!target) return;
  let el=document.querySelector(target.selector);
  if(!el){
    const section=target.selector.includes('tableau')?'#sec-tableau':target.selector.includes('cheminement')?'#sec-cheminement':target.selector.includes('borne')?'#sec-borne':null;
    if(section) el=document.querySelector(section);
  }
  if(!el) return;
  el.scrollIntoView({behavior:'smooth',block:'center'});
  setTimeout(()=>{
    el.classList.add('validationFocus');
    if(el.matches('input,select,textarea')){try{el.focus({preventScroll:true})}catch(e){el.focus()}}
    setTimeout(()=>el.classList.remove('validationFocus'),1800);
  },350);
}

function preReport(){
  save();
  const items=validateAudit();
  const errors=items.filter(x=>x.type==='error');
  const warnings=items.filter(x=>x.type==='warning');
  const status=errors.length?'À corriger':(warnings.length?'À vérifier':'Prêt à générer');
  const icon=errors.length?'⚠️':(warnings.length?'🔎':'✅');
  const list=items.length?items.map((x,i)=>`<div class="checkItem ${x.type}" data-validation-index="${i}" role="button" tabindex="0"><div class="checkIcon">${x.type==='error'?'✕':'!'}</div><div><b>${esc(x.text)}</b>${x.detail?`<div>${esc(x.detail)}</div>`:''}<div style="font-size:11px;color:#0f6f98;margin-top:5px;font-weight:800">↳ Appuyer pour aller à l’emplacement</div></div></div>`).join(''):`<div class="checkOk">Aucune anomalie détectée.</div>`;
  const overlay=document.createElement('div');
  overlay.className='validationOverlay';
  overlay.innerHTML=`<div class="validationBox"><div class="validationHead"><div><div class="validationKicker">VÉRIFICATION DU RAPPORT</div><h2>${icon} ${status}</h2></div><button class="closeValidation" onclick="this.closest('.validationOverlay').remove()">✕</button></div><div class="validationList">${list}</div><div class="validationActions"><button class="btn secondary" onclick="this.closest('.validationOverlay').remove()">Modifier l’audit</button>${!errors.length?`<button class="btn primary" onclick="this.closest('.validationOverlay').remove();report()">📄 Générer & afficher l’aperçu</button>`:''}</div></div>`;
  document.body.appendChild(overlay);
  overlay.querySelectorAll('[data-validation-index]').forEach(el=>{
    const go=()=>focusValidationTarget(items[Number(el.dataset.validationIndex)]);
    el.addEventListener('click',go);

function report(){
let w=null;
const reportAuditDate = formatDateFR(audit.date);

const escAttr=s=>String(s||"").replace(/&/g,"&amp;").replace(/"/g,"&quot;");
const photoCardHTML=(p,i)=>`
 <figure class="photoCard">
   <div class="photoFrame"><img src="${p.data}" alt="Photo ${i+1}" loading="eager" style="transform:rotate(${Number(p.rotation||0)}deg);transform-origin:center center"></div>
   <figcaption><span class="photoNumber">PHOTO ${i+1}</span>${p.caption&&p.caption!=="Photo"?`<span class="photoCaption">${esc(p.caption)}</span>`:""}</figcaption>
 </figure>`;

/* Construit des pages photo explicites : maximum 2 photos par page.
   Cela évite qu'une photo soit isolée sur une page sans le contexte de sa rubrique. */
const photoPageBlocks=(photos,title,sectionLabel)=>{
 if(!photos.length) return [];
 const chunks=[];
 for(let i=0;i<photos.length;i+=2){
   const chunk=photos.slice(i,i+2);
   const start=i+1, end=i+chunk.length;
   chunks.push({
     label: photos.length>2 ? `${sectionLabel}${start===1?'':' — SUITE'}` : sectionLabel,
     html:`<div class="photoSectionTitle">${esc(sectionLabel)}</div><div class="photoGrid n${chunk.length}">${chunk.map((p,j)=>photoCardHTML(p,i+j)).join('')}</div>`
   });
 }
 return chunks;
};
const noteHTML=(sec)=>{
 const n=(audit.notes&&audit.notes[sec]||"").trim();
 return n?`<div class="observation"><div class="observationTitle">OBSERVATION / CONSTAT</div><div class="observationText">${esc(n).replace(/\n/g,"<br>")}</div></div>`:"";
};

const techLabels={
divisionnaire:"Installation d’un tableau divisionnaire",
puissance:"Puissance souscrite",
compteur:"Type de compteur",
typeborne:"Type de borne",
environnement:"Environnement de la borne",
position:"Positionnement de la borne"
};

let pages=[];
const pageHeader=(n)=>`<div class="pageHeader"><div class="ensioMiniLogo"><img src="${ENSIO_LOGO}" alt="ENSIO" onerror="this.style.display='none';this.parentElement.textContent='ENSIO';"></div><div class="pageNum">${String(n).padStart(2,"0")}</div></div>`;
let reportPageNo=1;

/* Page de garde inspirée des rapports terrain : bandeau, titre, identité client. */
pages.push(`<section class="page cover">
  <div class="brandRow"><div class="ensioFixedLogo"><img src="${ENSIO_LOGO}" alt="ENSIO" onerror="this.style.display='none';this.parentElement.textContent='ENSIO';"></div><div class="auditMark">COMPTE-RENDU<br><small>D’AUDIT TERRAIN</small></div></div>
  <div class="coverShape"></div>
  <div class="coverTitle">COMPTE-RENDU<br>D’AUDIT</div>
  <div class="clientBlock">
    <div class="eyebrow">CLIENT FINAL</div>
    <div class="clientName">${esc(audit.client||"Nom du client")}</div>
    <div class="donorLine"><b>${esc(audit.donneur||"")}</b></div>
    <div style="margin-top:3mm;display:inline-flex;align-items:center;gap:2mm;padding:2.5mm 3.5mm;border-radius:999px;background:var(--t-soft);color:var(--t-accent);font-size:8px;font-weight:900;letter-spacing:1px">CRVT • ${esc(audit.typeVisite||"VTP")}</div>
  </div>
  <div class="coverMeta">
    <div><span>DATE DE LA VISITE</span><b>${esc(reportAuditDate)}</b></div>
    <div><span>TYPE DE VISITE</span><b>${esc(audit.typeVisite==="VTV"?"VTV — Visite technique virtuelle":"VTP — Visite technique physique")}</b></div>
    <div><span>AUDITEUR</span><b>${esc(audit.auditeur)}</b></div>
  </div>
</section>`);

/* Première page technique : uniquement les informations de base, sous forme proche des exemples. */
let tech=Object.entries(techLabels)
 .map(([k,label])=>[k,label,audit.data[k]])
 .filter(x=>x[2]!==""&&x[2]!=null);

pages.push(`<section class="page reportPage">
  ${pageHeader(reportPageNo++)}
  <h1>INFORMATIONS TECHNIQUES</h1>
  <div class="blueRule"></div>
  <div class="techTable">${tech.map(([k,label,v])=>`<div class="techRow"><div class="techLabel">${esc(label)}</div><div class="techValue">${esc(v)}</div></div>`).join("")}</div>
  ${((audit.data.commentaire||"").trim())?`<div class="extraCommentBox"><div class="extraCommentTitle">COMMENTAIRE / INFORMATIONS COMPLÉMENTAIRES</div><div class="extraCommentText">${esc(audit.data.commentaire.trim()).replace(/\n/g,"<br>")}</div></div>`:""}
</section>`);

/* Synthèse exclue du compte-rendu conformément au besoin utilisateur. */

/* Tableau électrique */
if(audit.sections.tableau){
 let photos=audit.photos.tableau||[];
 let place=audit.data.place||"";
 const blocks=photoPageBlocks(photos,"TABLEAU ÉLECTRIQUE","TABLEAU ÉLECTRIQUE");
 const total=blocks.length||1;
 blocks.forEach((block,idx)=>{
   const first=idx===0;
   const last=idx===blocks.length-1;
   pages.push(`<section class="page reportPage">
    ${pageHeader(reportPageNo++)}
    <h1>TABLEAU ÉLECTRIQUE${!first?' — SUITE':''}</h1><div class="blueRule"></div>
    ${first?`<div class="bigAnswer"><span>PLACE DISPONIBLE DANS LE TABLEAU</span><b>${esc(place||"Non renseigné")}</b></div>
    ${place==="Non"?`<div class="recommendation"><b>TABLEAU SUPPLÉMENTAIRE À PRÉVOIR</b>${photos.length?`<br>La photo ci-dessous permet de localiser la situation constatée.`:""}</div>`:""}`:""}
    ${block.html}
    ${last?noteHTML("tableau"):""}
   </section>`);
 });
 if(!blocks.length){
   pages.push(`<section class="page reportPage">${pageHeader(reportPageNo++)}<h1>TABLEAU ÉLECTRIQUE</h1><div class="blueRule"></div><div class="bigAnswer"><span>PLACE DISPONIBLE DANS LE TABLEAU</span><b>${esc(place||"Non renseigné")}</b></div>${place==="Non"?`<div class="recommendation"><b>TABLEAU SUPPLÉMENTAIRE À PRÉVOIR</b></div>`:""}${noteHTML("tableau")}</section>`);
 }
}

/* Cheminement : photos regroupées par deux, avec contexte répété sur les pages de suite. */
if(audit.sections.cheminement){
 let photos=audit.photos.cheminement||[];
 const blocks=photoPageBlocks(photos,"CHEMINEMENT DU CÂBLE","CHEMINEMENT DU CÂBLE");
 const total=blocks.length||1;
 blocks.forEach((block,idx)=>{

   const last=idx===blocks.length-1;
   pages.push(`<section class="page reportPage">

    ${first?`<div class="answers2">
     <div><span>TYPE DE PASSAGE</span><b>${esc(audit.data.passage||"Non renseigné")}</b></div>
     <div><span>PROTECTION / TYPE DE PASSAGE</span><b>${esc(audit.data.protection||"Non renseigné")}</b></div>
    </div>`:""}
    ${blocks.length?block.html:""}
    ${last?noteHTML("cheminement"):""}
   </section>`);
 });
 if(!blocks.length){
   pages.push(`<section class="page reportPage">${pageHeader(reportPageNo++)}<h1>CHEMINEMENT DU CÂBLE</h1><div class="blueRule"></div><div class="answers2"><div><span>TYPE DE PASSAGE</span><b>${esc(audit.data.passage||"Non renseigné")}</b></div><div><span>PROTECTION / TYPE DE PASSAGE</span><b>${esc(audit.data.protection||"Non renseigné")}</b></div></div>${noteHTML("cheminement")}</section>`);
 }
}

/* Emplacement borne : photo regroupées par deux, avec contexte répété si nécessaire. */
if(audit.sections.borne){
 let photos=audit.photos.borne||[];
 const blocks=photoPageBlocks(photos,"EMPLACEMENT DE LA BORNE","EMPLACEMENT DE LA BORNE");
 blocks.forEach((block,idx)=>{
   const first=idx===0;
   const last=idx===blocks.length-1;
   pages.push(`<section class="page reportPage">
    ${pageHeader(reportPageNo++)}
    <h1>EMPLACEMENT DE LA BORNE${!first?' — SUITE':''}</h1><div class="blueRule"></div>
    ${block.html}
    ${last?noteHTML("borne"):""}
   </section>`);
 });
 if(!blocks.length){
   pages.push(`<section class="page reportPage">${pageHeader(reportPageNo++)}<h1>EMPLACEMENT DE LA BORNE</h1><div class="blueRule"></div>${noteHTML("borne")}</section>`);
 }
}


/* Pied de page uniforme sur les pages intérieures : client + pagination. */
const totalPages=pages.length;
pages=pages.map((html,idx)=>{
  if(idx===0) return html;
  const footer=`<div class="reportFooter"><span class="client">${esc(audit.client||"Audit terrain")}</span><span class="pageMark">Page ${idx+1} / ${totalPages}</span></div>`;

let currentPhotoViewerSec=null;
let currentPhotoViewerIndex=-1;

function applyCurrentPhotoRotation(){
  const p=(audit.photos?.[currentPhotoViewerSec]||[])[currentPhotoViewerIndex];
  const img=document.getElementById("photoViewerImg");
  if(!p || !img) return;
  const deg=Number(p.rotation||0);
  img.style.transform=`rotate(${deg}deg)`;
}

async function rotateCurrentPhoto(e){
  if(e) e.stopPropagation();
  const arr=audit.photos?.[currentPhotoViewerSec]||[];
  const p=arr[currentPhotoViewerIndex];
  if(!p) return;
  p.rotation=(Number(p.rotation||0)+90)%360;
  applyCurrentPhotoRotation();
  await save();
  render();
  openPhotoViewer(currentPhotoViewerSec,currentPhotoViewerIndex);
}

function openPhotoViewer(sec,i){
  const p=(audit.photos?.[sec]||[])[i]; if(!p) return;
  const v=document.getElementById("photoViewer"), img=document.getElementById("photoViewerImg"), title=document.getElementById("photoViewerTitle");
  currentPhotoViewerSec=sec;
  currentPhotoViewerIndex=i;
  img.src=p.data;
  title.textContent=(p.caption&&p.caption!=="Photo")?p.caption:("Photo "+(i+1));
  applyCurrentPhotoRotation();
  v.classList.add("open"); document.body.style.overflow="hidden";
}
function closePhotoViewer(e){
  if(e && e.target && (e.target.id==="photoViewerImg" || e.target.id==="photoViewerRotate")) return;
  const v=document.getElementById("photoViewer");
  if(v){v.classList.remove("open");document.body.style.overflow="";}
}
document.addEventListener("keydown",e=>{if(e.key==="Escape")closePhotoViewer();});

/* V1.29 — historique professionnel */
function auditStatus(a){
  const vals=Object.values(a.checks||{});
  const total=vals.filter(v=>v==="C"||v==="NC").length;
  const nc=vals.filter(v=>v==="NC").length;
  const active=Object.values(a.sections||{}).filter(Boolean).length;
  return (nc===0 && total>0 && active>0) ? "Terminé" : "Brouillon";
}
function duplicateAudit(id){
  const arr=JSON.parse(localStorage.getItem(listKey)||"[]");
  const a=arr.find(x=>x.id===id);
  if(!a)return;
  const copy=JSON.parse(JSON.stringify(a));
  copy.id=Date.now();
  copy.date=new Date().toISOString().slice(0,10);
  copy.client=(copy.client||"") + " — Copie";
  arr.unshift(copy);
  localStorage.setItem(listKey,JSON.stringify(arr));
  audit=copy; save(); render(); scrollTo(0,0); toast("Audit dupliqué");
}
function deleteAudit(id){
  if(!confirm("Supprimer définitivement cet audit ?")) return;
  const arr=JSON.parse(localStorage.getItem(listKey)||"[]").filter(x=>x.id!==id);
  localStorage.setItem(listKey,JSON.stringify(arr));
  if(audit.id===id){audit=fresh();save();render();}
  else history();
  toast("Audit supprimé");
}
function exportAuditJSON(id){
  const arr=JSON.parse(localStorage.getItem(listKey)||"[]");
  const a=arr.find(x=>x.id===id);
  if(!a)return;
  const blob=new Blob([JSON.stringify(a,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const link=document.createElement("a");
  link.href=url; link.download="audit-"+(a.client||"sans-nom").replace(/[^\w\-]+/g,"-")+"-"+a.date+".json";
  link.click(); URL.revokeObjectURL(url);
}
function historyProfessional(){
  const el=document.getElementById("hist"); if(!el)return;
  const all=JSON.parse(localStorage.getItem(listKey)||"[]");
  const old=el.querySelector(".v129-history");
  if(old)old.remove();
  const box=document.createElement("div");
  box.className="v129-history";
  box.innerHTML=`
    <div class="v129-toolbar">
      <input id="v129-search" placeholder="🔎 Rechercher client, auditeur, numéro..." />
      <select id="v129-status"><option value="all">Tous les statuts</option><option value="Terminé">Terminés</option><option value="Brouillon">Brouillons</option></select>
      <select id="v129-sort"><option value="new">Plus récents</option><option value="old">Plus anciens</option><option value="client">Client A → Z</option></select>
    </div>
    <div id="v129-count" class="small"></div>
    <div id="v129-list"></div>`;
  el.prepend(box);
  const search=box.querySelector("#v129-search"), status=box.querySelector("#v129-status"), sort=box.querySelector("#v129-sort");
  function draw(){
    let q=(search.value||"").toLowerCase().trim();
    let rows=all.filter(a=>{
      const hay=[a.client,a.auditeur,a.dossier,a.date,String(a.id)].join(" ").toLowerCase();
      return (!q||hay.includes(q)) && (status.value==="all"||auditStatus(a)===status.value);
    });
    if(sort.value==="old")rows.sort((a,b)=>a.id-b.id);
    else if(sort.value==="client")rows.sort((a,b)=>(a.client||"").localeCompare(b.client||"","fr",{sensitivity:"base"}));
    else rows.sort((a,b)=>b.id-a.id);
    box.querySelector("#v129-count").textContent=`${rows.length} audit(s) affiché(s) · ${all.filter(a=>auditStatus(a)==="Terminé").length} terminé(s) · ${all.filter(a=>auditStatus(a)==="Brouillon").length} brouillon(s)`;
    box.querySelector("#v129-list").innerHTML=rows.length?rows.map(a=>{
      const st=auditStatus(a);
      const cls=st==="Terminé"?"done":"draft";
      return `<div class="v129-card">
        <div><b>${esc(a.client||"Sans nom")}</b><span class="v129-badge ${cls}">${st}</span></div>
        <div class="small">${esc(a.date||"")} · ${esc(a.auditeur||"")} · N° ${esc(a.id)}</div>
        <div class="v129-actions">
          <button class="btn secondary" onclick="loadAudit(${a.id})">Ouvrir</button>
          <button class="btn secondary" onclick="duplicateAudit(${a.id})">Dupliquer</button>
          <button class="btn secondary" onclick="exportAuditJSON(${a.id})">Exporter</button>
          <button class="btn danger" onclick="deleteAudit(${a.id})">Supprimer</button>
        </div>
      </div>`;
    }).join(""):"<div class='small'>Aucun audit correspondant.</div>";
  }
  [search,status,sort].forEach(x=>x.addEventListener("input",draw));
  draw();
}

 audit.visitTemplate=k;
 if(t.sections) audit.sections={...audit.sections,...t.sections};

function v20SigCanvas(canvas,key){

}

 <div class="v20Tool"><h3>📍 Géolocalisation</h3><p>Enregistre la position de la visite VTP.</p><div class="v20Gps">${gps}<button class="btn primary" id="v20Gps">Capturer</button>${audit.gps?'<button class="btn secondary" id="v20GpsClear">Supprimer</button>':''}</div></div>
 <div class="v20Tool"><h3>✍️ Signatures</h3><p>Client et auditeur, directement au doigt.</p><div class="row"><span class="v20GpsBadge">${sig}</span><button class="btn primary" id="v20Sign">Ouvrir les signatures</button></div></div>
 <div class="v20Tool"><h3>💾 Sauvegarde</h3><p>Le brouillon est enregistré automatiquement à chaque modification.</p><span class="v20Status">✓ Sauvegarde locale active</span></div>
 </div>`;

 el.querySelectorAll('[data-v20-template]').forEach(b=>b.onclick=()=>v20ApplyTemplate(b.dataset.v20Template));
