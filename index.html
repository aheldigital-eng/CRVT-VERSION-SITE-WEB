<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b6e9e">
<title>CRVT — Compte rendu de visite technique</title>
<style>
html,body{margin:0;padding:0;width:100%;min-height:100%;background:#f1f5f9}
#boot{padding:24px;font:16px Arial;color:#173247}
body.crvt-annotation-open{padding-top:0!important;overflow:hidden!important}
body.crvt-annotation-open>header,body.crvt-annotation-open>#quickNav{display:none!important}
body.crvt-annotation-open .crvt-annotator.modal,body.crvt-annotation-open .modal.crvt-annotator{position:fixed!important;inset:0!important;z-index:2147483647!important;width:100vw!important;height:100dvh!important;margin:0!important;padding:8px!important;box-sizing:border-box!important}
body.crvt-annotation-open .crvt-annotator.modal .modalbox,body.crvt-annotation-open .modal.crvt-annotator .modalbox{height:100%!important;max-height:none!important;box-sizing:border-box!important}
</style>
</head>
<body>
<div id="boot">Chargement de CRVT…</div>
<script>
(async()=>{
  try{
    const r=await fetch('CRVT_DERNIERE_VERSION_VALIDEe_index-1.html',{cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const s=await r.text();
    const doc=new DOMParser().parseFromString(s,'text/html');
    document.open();
    document.write(doc.documentElement.outerHTML);
    document.close();
    const style=document.createElement('style');
    style.id='crvt-annotation-open-fix';
    style.textContent=`
      body.crvt-annotation-open{padding-top:0!important;overflow:hidden!important}
      body.crvt-annotation-open>header,body.crvt-annotation-open>#quickNav{display:none!important}
      body.crvt-annotation-open .crvt-annotator.modal,body.crvt-annotation-open .modal.crvt-annotator{position:fixed!important;inset:0!important;z-index:2147483647!important;width:100vw!important;height:100dvh!important;margin:0!important;padding:8px!important;box-sizing:border-box!important}
      body.crvt-annotation-open .crvt-annotator.modal .modalbox,body.crvt-annotation-open .modal.crvt-annotator .modalbox{height:100%!important;max-height:none!important;box-sizing:border-box!important}
    `;
    document.head.appendChild(style);
    function update(){
      const modals=[...document.querySelectorAll('.modal')];
      const m=modals.find(x=>x.querySelector('.tools'));
      const open=!!m && (()=>{const cs=getComputedStyle(m);return cs.display!=='none'&&cs.visibility!=='hidden'&&parseFloat(cs.opacity||'1')>0})();
      document.body.classList.toggle('crvt-annotation-open',open);
      if(m)m.classList.add('crvt-annotator');
    }
    update();
    new MutationObserver(update).observe(document.body,{subtree:true,childList:true,attributes:true,attributeFilter:['style','class','hidden']});
  }catch(e){
    const b=document.getElementById('boot');
    if(b)b.textContent='Erreur de chargement CRVT : '+e.message;
  }
})();
</script>
</body>
</html>
