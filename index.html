</style></head><body><header><div class="top"><div><b>CRVT</b><small>Compte rendu de visite technique</small></div><div id="dateTop" class="dateTop"></div></div></header><nav class="quick"><div><button data-go="general">Général</button><button data-go="infos">Informations</button><button data-go="modules">Modules</button><button data-go="tableau">Tableau</button><button data-go="cheminement">Cheminement</button><button data-go="borne">Borne</button><button data-go="history">Mes audits</button></div></nav><main id="app" class="wrap"></main><div class="bottom noPrint"><button class="btn secondary" id="newBtn">Nouveau</button><button class="btn secondary" id="saveBtn">Enregistrer</button><button class="btn primary" id="reportBtn">Générer le PDF</button></div><script>
const DB='CRVT_FINAL_DB',STORE='audits';let dbp=null,historyCache=[],audit=null;const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function openDB(){if(dbp)return dbp;dbp=new Promise((res,rej)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE,{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});return dbp}function put(x){return openDB().then(db=>new Promise((res,rej)=>{const t=db.transaction(STORE,'readwrite');t.objectStore(STORE).put(x);t.oncomplete=()=>res();t.onerror=()=>rej(t.error)}))}function all(){return openDB().then(db=>new Promise((res,rej)=>{const q=db.transaction(STORE,'readonly').objectStore(STORE).getAll();q.onsuccess=()=>res(q.result||[]);q.onerror=()=>rej(q.error)}))}function del(id){return openDB().then(db=>new Promise((res,rej)=>{const t=db.transaction(STORE,'readwrite');t.objectStore(STORE).delete(id);t.oncomplete=res;t.onerror=()=>rej(t.error)}))}
function fresh(){return{id:Date.now(),date:new Date().toISOString().slice(0,10),client:'',auditeur:'',typeVisite:'VTP',status:'Brouillon',commentaire:'',data:{puissance:'',compteur:'',divisionnaire:'',typeborne:'',environnement:'',position:'',longueur:'',hauteur:'',observations:''},sections:{tableau:false,cheminement:false,borne:false},photos:{tableau:[],cheminement:[],borne:[]},notes:{},signatureClient:'',signatureAuditeur:'',createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()}}
function fr(d){if(!d)return'';const [y,m,x]=String(d).slice(0,10).split('-');return x+'/'+m+'/'+y}function toast(t){const x=document.createElement('div');x.className='toast';x.textContent=t;document.body.appendChild(x);setTimeout(()=>x.remove(),1800)}async function save(){audit.updatedAt=new Date().toISOString();await put(JSON.parse(JSON.stringify(audit)));historyCache=await all();toast('Audit enregistré')}async function refreshHistory(){historyCache=await all()}
function field(k,label,opts=''){const v=audit.data[k]||'';if(opts)return `<label>${label}</label><select data-f="${k}"><option value="">Sélectionner…</option>${opts.split('|').map(o=>`<option ${v===o?'selected':''}>${esc(o)}</option>`).join('')}</select>`;return `<label>${label}</label><input data-f="${k}" value="${esc(v)}">`}
function render(){document.querySelector('#dateTop').textContent=fr(audit.date);let h=`<section class="card" id="general"><span class="tag">AUDIT</span><h2>Informations générales</h2><div class="grid"><div><label>Date de la visite</label><input id="date" value="${fr(audit.date)}" inputmode="numeric" maxlength="10" placeholder="JJ/MM/AAAA"></div><div><label>Auditeur</label><input id="auditeur" value="${esc(audit.auditeur)}"></div><div class="full"><label>Client final</label><input id="client" value="${esc(audit.client)}" placeholder="Nom du client"></div><div class="full"><label>Type de visite</label><div class="visitTypes"><button class="visitType ${audit.typeVisite==='VTP'?'active':''}" data-vt="VTP">🏠 VTP — Visite technique physique</button><button class="visitType ${audit.typeVisite==='VTV'?'active':''}" data-vt="VTV">💻 VTV — Visite technique virtuelle</button></div></div></div></section>`;
h+=`<section class="card" id="infos"><span class="tag">INFORMATIONS TECHNIQUES</span><h2>Mesures et installation</h2><div class="grid"><div>${field('puissance','Puissance souscrite','3 kVA|6 kVA|9 kVA|12 kVA|15 kVA|18 kVA|20 kVA|24 kVA|30 kVA|36 kVA|Autre')}</div><div>${field('compteur','Type de compteur','Monophasé|Triphasé|Autre')}</div><div>${field('divisionnaire','Tableau divisionnaire','Oui|Non')}</div><div>${field('typeborne','Type de borne','Monophasé|Triphasé|Autre')}</div><div>${field('environnement','Environnement de la borne','Extérieur|Intérieur|Autre')}</div><div>${field('position','Positionnement de la borne','Sur mur|Sur pied|Autre')}</div><div>${field('longueur','Longueur cheminement (m)')}</div><div>${field('hauteur','Hauteur / profondeur (m)')}</div><div class="full"><label>Commentaire / informations complémentaires</label><textarea id="commentaire" placeholder="Ex. travaux à la charge du client…">${esc(audit.commentaire)}</textarea></div><div class="full"><label>Observations techniques</label><textarea data-f="observations" placeholder="Relevés, contraintes, travaux à prévoir…">${esc(audit.data.observations||'')}</textarea></div></div></section>`;
h+=`<section class="card" id="modules"><span class="tag">MODULES</span><h2>Contenu de l’audit</h2>${[['tableau','Tableau électrique'],['cheminement','Cheminement du câble'],['borne','Emplacement de la borne']].map(([k,t])=>`<div class="module"><div class="moduleHead"><b>${t}</b><button class="btn ${audit.sections[k]?'primary':'secondary'}" data-toggle="${k}">${audit.sections[k]?'✓ Activé':'Ajouter'}</button></div>${audit.sections[k]?module(k,t):''}</div>`).join('')}</section>`;
h+=`<section class="card" id="signatures"><span class="tag">SIGNATURES</span><h2>Validation de la visite</h2><div class="draftBar"><span class="muted">${audit.signatureClient||audit.signatureAuditeur?'✓ Signature(s) enregistrée(s)':'Aucune signature enregistrée'}</span><button class="btn primary" id="signBtn">✍️ Ouvrir les signatures</button></div></section>`;
h+=`<section class="card" id="history"><span class="tag">HISTORIQUE</span><h2>Mes audits</h2><div class="row"><button class="btn secondary" id="finishBtn">✓ Marquer terminé</button><button class="btn secondary" id="exportBtn">⬇️ Sauvegarder</button></div><div id="histList"></div></section>`;
document.querySelector('#app').innerHTML=h;bind();drawHistory()}
function module(k,t){const arr=audit.photos[k]||[];let fields='';if(k==='tableau')fields=`<label>Place disponible dans le tableau ?</label><select data-f="place"><option value="">Sélectionner…</option><option ${audit.data.place==='Oui'?'selected':''}>Oui</option><option ${audit.data.place==='Non'?'selected':''}>Non</option></select>`;if(k==='cheminement')fields=`<div class="grid"><div>${field('passage','Type de passage','Apparent|Vide sanitaire|Combles|Faux plafond|Autre')}</div><div>${field('protection','Protection du câble','Tube IRL|Fourreau en tranchée|Goulotte intérieure|Autre')}</div></div>`;return `${fields}<label>Observation / constat</label><textarea data-note="${k}" placeholder="Décrire le constat…">${esc(audit.notes[k]||'')}</textarea><div class="photoActions"><button class="btn primary" data-photo="${k}" data-mode="camera">📷 Prendre une photo</button><button class="btn secondary" data-photo="${k}" data-mode="gallery">🖼️ Choisir dans la galerie</button></div><div class="photos">${arr.length?arr.map((p,i)=>photoHtml(k,p,i)).join(''):'<div class="empty">Aucune photo pour cette partie.</div>'}</div>`}
function photoHtml(k,p,i){return `<div class="photo"><div class="photoMeta">PHOTO ${i+1} ${p.annotations?.length?'✓ Annotée':''}</div><img src="${p.data}" style="transform:rotate(${p.rotation||0}deg)"><input data-cap="${k}" data-i="${i}" value="${esc(p.caption||'Photo')}" placeholder="Légende"><div class="photoActions"><button class="btn secondary" data-ann="${k}" data-i="${i}">✏️ Annoter</button><button class="btn outline" data-rot="${k}" data-i="${i}">↻ Tourner</button><button class="btn danger" data-delphoto="${k}" data-i="${i}">🗑️</button></div></div>`}
function bind(){document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>document.getElementById(b.dataset.go)?.scrollIntoView({behavior:'smooth',block:'start'}));document.querySelectorAll('[data-vt]').forEach(b=>b.onclick=()=>{audit.typeVisite=b.dataset.vt;save().then(render)});document.querySelector('#date').oninput=e=>{const x=e.target.value.replace(/\D/g,'').slice(0,8);e.target.value=x.length>4?x.slice(0,2)+'/'+x.slice(2,4)+'/'+x.slice(4):x.length>2?x.slice(0,2)+'/'+x.slice(2):x;audit.date=parseFR(e.target.value)||audit.date;document.querySelector('#dateTop').textContent=fr(audit.date);saveSilent()};document.querySelector('#auditeur').oninput=e=>{audit.auditeur=e.target.value;saveSilent()};document.querySelector('#client').oninput=e=>{audit.client=e.target.value;saveSilent()};document.querySelector('#commentaire').oninput=e=>{audit.commentaire=e.target.value;saveSilent()};document.querySelectorAll('[data-f]').forEach(e=>e.oninput=()=>{audit.data[e.dataset.f]=e.value;saveSilent()});document.querySelectorAll('[data-note]').forEach(e=>e.oninput=()=>{audit.notes[e.dataset.note]=e.value;saveSilent()});document.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>{audit.sections[b.dataset.toggle]=!audit.sections[b.dataset.toggle];save().then(render)});document.querySelectorAll('[data-photo]').forEach(b=>b.onclick=()=>picker(b.dataset.photo,b.dataset.mode));document.querySelectorAll('[data-cap]').forEach(e=>e.oninput=()=>{audit.photos[e.dataset.cap][+e.dataset.i].caption=e.value;saveSilent()});document.querySelectorAll('[data-rot]').forEach(b=>b.onclick=()=>{let p=audit.photos[b.dataset.rot][+b.dataset.i];p.rotation=(p.rotation+90)%360;save().then(render)});document.querySelectorAll('[data-delphoto]').forEach(b=>b.onclick=()=>{audit.photos[b.dataset.delphoto].splice(+b.dataset.i,1);save().then(render)});document.querySelectorAll('[data-ann]').forEach(b=>b.onclick=()=>annotate(b.dataset.ann,+b.dataset.i));document.querySelector('#signBtn').onclick=signatures;document.querySelector('#finishBtn').onclick=finish;document.querySelector('#exportBtn').onclick=exportBackup}
function saveSilent(){audit.updatedAt=new Date().toISOString();put(JSON.parse(JSON.stringify(audit))).catch(()=>{})}function parseFR(v){const m=(v||'').match(/^(\d{2})\/(\d{2})\/(\d{4})$/);if(!m)return null;return `${m[3]}-${m[2]}-${m[1]}`}
function picker(sec,mode){
  const oldInput=document.getElementById('crvtPhotoPicker');
  if(oldInput) oldInput.remove();
  const i=document.createElement('input');
  i.id='crvtPhotoPicker';
  i.type='file';
  i.accept='image/*';
  i.setAttribute('aria-label',mode==='camera'?'Prendre une photo':'Choisir une photo');
  if(mode==='camera') i.setAttribute('capture','environment');
  i.style.position='fixed';i.style.left='50%';i.style.top='50%';i.style.width='1px';i.style.height='1px';i.style.opacity='0.01';i.style.zIndex='99999';
  document.body.appendChild(i);
  i.onchange=()=>{const f=i.files&&i.files[0];if(f)addPhoto(f,sec);setTimeout(()=>i.remove(),500)};
  try{i.click()}catch(e){toast('Impossible d’ouvrir la galerie');i.remove()}
}
function addPhotofunction addPhotofunction addPhoto(file,sec){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const max=1800;let w=im.naturalWidth,h=im.naturalHeight;if(Math.max(w,h)>max){const q=max/Math.max(w,h);w=Math.round(w*q);h=Math.round(h*q)}const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);audit.photos[sec].push({data:c.toDataURL('image/jpeg',.82),baseData:c.toDataURL('image/jpeg',.82),caption:'Photo',annotations:[],rotation:0});save().then(render)};im.src=r.result};r.readAsDataURL(file)}
function finish(){const e=[];if(!audit.client.trim())e.push('Client non renseigné');if(!audit.auditeur.trim())e.push('Auditeur non renseigné');if(!audit.sections.tableau&&!audit.sections.cheminement&&!audit.sections.borne)e.push('Aucun module sélectionné');if(e.length){validation(e);return}audit.status='Terminé';save().then(render)}function validation(items){const x=document.createElement('div');x.className='validation';x.innerHTML=`<div class="validationBox"><div class="validationHead"><div><b>Vérification du rapport</b><div class="muted">${items.length} point(s) à corriger</div></div><button class="btn secondary">✕</button></div>${items.map(i=>`<div class="validationItem"><b class="err">⚠ ${esc(i)}</b></div>`).join('')}<div style="padding:14px"><button class="btn secondary">Modifier l’audit</button></div></div>`;document.body.appendChild(x);x.querySelectorAll('button').forEach(b=>b.onclick=()=>x.remove())}
function signatures(){const m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="modalBox"><div class="tools"><button class="btn secondary" id="closeSig">Fermer</button><button class="btn primary" id="saveSig">✓ Valider les signatures</button></div><div class="sigGrid"><div class="sigBox"><h3>Signature client</h3><canvas id="sigC" width="900" height="380"></canvas></div><div class="sigBox"><h3>Signature auditeur</h3><canvas id="sigA" width="900" height="380"></canvas></div></div></div>`;document.body.appendChild(m);sigCanvas(m.querySelector('#sigC'),'signatureClient');sigCanvas(m.querySelector('#sigA'),'signatureAuditeur');m.querySelector('#closeSig').onclick=()=>m.remove();m.querySelector('#saveSig').onclick=()=>{save().then(()=>{m.remove();render();toast('Signatures enregistrées')})}}
function sigCanvas(c,key){const ctx=c.getContext('2d');ctx.lineWidth=5;ctx.lineCap='round';ctx.strokeStyle='#102536';let d=false;const p=e=>{const r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*c.width/r.width,y:(e.clientY-r.top)*c.height/r.height}};c.onpointerdown=e=>{d=true;c.setPointerCapture(e.pointerId);let q=p(e);ctx.beginPath();ctx.moveTo(q.x,q.y)};c.onpointermove=e=>{if(!d)return;let q=p(e);ctx.lineTo(q.x,q.y);ctx.stroke()};c.onpointerup=()=>{d=false;audit[key]=c.toDataURL('image/png')};if(audit[key]){const im=new Image();im.onload=()=>ctx.drawImage(im,0,0,c.width,c.height);im.src=audit[key]}}
function annotate(sec,i){const p=audit.photos[sec][i],m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="modalBox"><div class="tools"><button class="btn secondary" data-tool="select">↖ Sélection</button><button class="btn secondary" data-tool="pen">✏️ Dessin</button><button class="btn secondary" data-tool="arrow">↗ Flèche</button><button class="btn secondary" data-tool="line">／ Ligne</button><button class="btn secondary" data-tool="circle">⭕ Cercle</button><button class="btn secondary" data-tool="text">T Texte</button><button class="btn secondary" id="rotL">↶</button><button class="btn secondary" id="rotR">↷</button><button class="btn secondary" id="undo">↶ Annuler</button><button class="btn danger" id="annCancel">Annuler</button><button class="btn primary" id="annSave">✓ Enregistrer</button></div><div class="canvasWrap"><canvas></canvas></div></div>`;document.body.appendChild(m);const c=m.querySelector('canvas'),ctx=c.getContext('2d'),im=new Image();let tool='select',start=null,obj=null,objects=JSON.parse(JSON.stringify(p.annotations||[])),history=[];im.onload=()=>{const r=c.parentElement,s=Math.min(r.clientWidth/im.width,r.clientHeight/im.height,1);c.width=Math.max(1,im.width*s);c.height=Math.max(1,im.height*s);draw()};im.src=p.baseData||p.data;function pt(e){const r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*c.width/r.width,y:(e.clientY-r.top)*c.height/r.height}}function draw(){ctx.clearRect(0,0,c.width,c.height);ctx.drawImage(im,0,0,c.width,c.height);objects.forEach(o=>{ctx.strokeStyle=o.color||'#e11d48';ctx.fillStyle=o.color||'#e11d48';ctx.lineWidth=5;ctx.setLineDash(o.dashed?[12,8]:[]);if(o.type==='pen'){ctx.beginPath();o.points.forEach((q,j)=>j?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y));ctx.stroke()}else if(o.type==='line'||o.type==='arrow'){ctx.beginPath();ctx.moveTo(o.x,o.y);ctx.lineTo(o.x2,o.y2);ctx.stroke();if(o.type==='arrow'){const a=Math.atan2(o.y2-o.y,o.x2-o.x),L=20;ctx.setLineDash([]);ctx.beginPath();ctx.moveTo(o.x2,o.y2);ctx.lineTo(o.x2-L*Math.cos(a-.5),o.y2-L*Math.sin(a-.5));ctx.lineTo(o.x2-L*Math.cos(a+.5),o.y2-L*Math.sin(a+.5));ctx.fill()}}else if(o.type==='circle'){ctx.beginPath();ctx.ellipse((o.x+o.x2)/2,(o.y+o.y2)/2,Math.abs(o.x2-o.x)/2,Math.abs(o.y2-o.y)/2,0,0,Math.PI*2);ctx.stroke()}else if(o.type==='text'){ctx.font='bold 28px Arial';ctx.fillText(o.text,o.x,o.y)}ctx.setLineDash([])})}m.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>tool=b.dataset.tool);c.onpointerdown=e=>{if(tool==='text'){const t=prompt('Texte à ajouter');if(t){objects.push({type:'text',x:pt(e).x,y:pt(e).y,text:t,color:'#e11d48'});draw()}return}start=pt(e);obj=tool==='pen'?{type:'pen',points:[start],color:'#e11d48'}:{type:tool,x:start.x,y:start.y,x2:start.x,y2:start.y,color:'#e11d48'};objects.push(obj);history.push(JSON.parse(JSON.stringify(objects.slice(0,-1))));};c.onpointermove=e=>{if(!obj)return;const q=pt(e);if(obj.type==='pen')obj.points.push(q);else{obj.x2=q.x;obj.y2=q.y}draw()};c.onpointerup=()=>{obj=null};m.querySelector('#undo').onclick=()=>{objects=history.pop()||[];draw()};m.querySelector('#rotL').onclick=()=>{p.rotation=(p.rotation+270)%360;draw()};m.querySelector('#rotR').onclick=()=>{p.rotation=(p.rotation+90)%360;draw()};m.querySelector('#annCancel').onclick=()=>m.remove();m.querySelector('#annSave').onclick=()=>{p.annotations=objects;p.data=rasterize(im,c,objects);save().then(()=>{m.remove();render()})}}
function rasterize(im,c,objects){const out=document.createElement('canvas');out.width=im.naturalWidth;out.height=im.naturalHeight;const x=out.getContext('2d');x.drawImage(im,0,0,out.width,out.height);const sx=out.width/c.width,sy=out.height/c.height;objects.forEach(o=>{x.strokeStyle=o.color||'#e11d48';x.fillStyle=o.color||'#e11d48';x.lineWidth=5*((sx+sy)/2);if(o.type==='pen'){x.beginPath();o.points.forEach((q,j)=>j?x.lineTo(q.x*sx,q.y*sy):x.moveTo(q.x*sx,q.y*sy));x.stroke()}else if(o.type==='line'||o.type==='arrow'){x.beginPath();x.moveTo(o.x*sx,o.y*sy);x.lineTo(o.x2*sx,o.y2*sy);x.stroke()}else if(o.type==='circle'){x.beginPath();x.ellipse((o.x+o.x2)*sx/2,(o.y+o.y2)*sy/2,Math.abs(o.x2-o.x)*sx/2,Math.abs(o.y2-o.y)*sy/2,0,0,Math.PI*2);x.stroke()}else if(o.type==='text'){x.font='bold '+(28*sx)+'px Arial';x.fillText(o.text,o.x*sx,o.y*sy)}});return out.toDataURL('image/jpeg',.92)}
function report(){const tech=[['Puissance souscrite',audit.data.puissance],['Type de compteur',audit.data.compteur],['Tableau divisionnaire',audit.data.divisionnaire],['Type de borne',audit.data.typeborne],['Environnement',audit.data.environnement],['Positionnement',audit.data.position],['Longueur cheminement',audit.data.longueur?audit.data.longueur+' m':''],['Hauteur / profondeur',audit.data.hauteur?audit.data.hauteur+' m':'']].filter(x=>x[1]);let pages=[];pages.push(`<section class="page cover"><div class="brand">CRVT</div><div class="kicker">COMPTE RENDU DE VISITE TECHNIQUE</div><h1>${esc(audit.client||'Client')}</h1><div class="meta"><b>Date</b><span>${fr(audit.date)}</span><b>Auditeur</b><span>${esc(audit.auditeur)}</span><b>Type</b><span>${audit.typeVisite==='VTV'?'VTV — Visite virtuelle':'VTP — Visite physique'}</span></div></section>`);pages.push(`<section class="page"><h2>Informations techniques</h2><div class="rule"></div><div class="table">${tech.map(x=>`<div><b>${esc(x[0])}</b><span>${esc(x[1])}</span></div>`).join('')}</div>${audit.commentaire.trim()?`<div class="comment"><b>COMMENTAIRE</b><p>${esc(audit.commentaire).replace(/\n/g,'<br>')}</p></div>`:''}${audit.data.observations?.trim()?`<div class="comment"><b>OBSERVATIONS TECHNIQUES</b><p>${esc(audit.data.observations).replace(/\n/g,'<br>')}</p></div>`:''}</section>`);for(const [k,t] of [['tableau','TABLEAU ÉLECTRIQUE'],['cheminement','CHEMINEMENT DU CÂBLE'],['borne','EMPLACEMENT DE LA BORNE']])if(audit.sections[k]){const arr=audit.photos[k]||[];let content=`<section class="page"><h2>${t}</h2><div class="rule"></div>`;if(k==='tableau')content+=`<div class="answer"><b>PLACE DISPONIBLE DANS LE TABLEAU</b><strong>${esc(audit.data.place||'Non renseigné')}</strong></div>`;if(k==='cheminement')content+=`<div class="answers"><div><b>TYPE DE PASSAGE</b><strong>${esc(audit.data.passage||'Non renseigné')}</strong></div><div><b>PROTECTION</b><strong>${esc(audit.data.protection||'Non renseigné')}</strong></div></div>`;content+=arr.length?`<div class="photoGrid">${arr.map((p,i)=>`<figure><img src="${p.data}" style="transform:rotate(${p.rotation||0}deg)"><figcaption>PHOTO ${i+1}${p.caption&&p.caption!=='Photo'?' — '+esc(p.caption):''}</figcaption></figure>`).join('')}</div>`:'<div class="empty">Aucune photo.</div>';if(audit.notes[k]?.trim())content+=`<div class="comment"><b>OBSERVATION / CONSTAT</b><p>${esc(audit.notes[k]).replace(/\n/g,'<br>')}</p></div>`;content+='</section>';pages.push(content)}if(audit.signatureClient||audit.signatureAuditeur)pages.push(`<section class="page"><h2>Validation de la visite</h2><div class="rule"></div><div class="sigs">${audit.signatureClient?`<div><b>Signature client</b><img src="${audit.signatureClient}"></div>`:''}${audit.signatureAuditeur?`<div><b>Signature auditeur</b><img src="${audit.signatureAuditeur}"></div>`:''}</div></section>`);const html=`<!doctype html><html><head><meta charset="utf-8"><title>CRVT — ${esc(audit.client)}</title><style>@page{size:A4;margin:0}*{box-sizing:border-box}body{margin:0;background:#dfe6eb;font-family:Arial,sans-serif;color:#142331}.page{width:210mm;min-height:297mm;background:#fff;margin:0 auto 7mm;padding:18mm 15mm;page-break-after:always;position:relative}.page:last-child{page-break-after:auto}.cover{background:linear-gradient(135deg,#071a2b,#0b496b 58%,#13a9b8);color:#fff;display:flex;flex-direction:column;justify-content:center}.cover .brand{font-size:26px;font-weight:900;letter-spacing:2px}.kicker{font-size:10px;letter-spacing:2px;margin-top:10mm;opacity:.8}.cover h1{font-size:38px;margin:8mm 0 15mm}.meta{display:grid;grid-template-columns:35mm 1fr;gap:5mm;border-top:2px solid #ffffff55;padding-top:7mm}.meta b{opacity:.65;text-transform:uppercase;font-size:9px;letter-spacing:1px}.meta span{font-size:14px;font-weight:800}.page h2{font-size:25px;margin:0 0 5mm}.rule{height:3px;background:#14a7b8;margin-bottom:9mm}.table{border:1px solid #ccd8df}.table>div{display:grid;grid-template-columns:52% 48%;min-height:16mm;border-bottom:1px solid #dce5ea}.table>div:last-child{border:0}.table b{background:#f1f6f8;padding:5mm;font-size:9px;text-transform:uppercase;letter-spacing:1px}.table span{padding:5mm;font-size:13px;font-weight:800}.comment{border:1px solid #ccd8df;border-left:5px solid #14a7b8;padding:5mm;margin-top:6mm}.comment b{font-size:9px;letter-spacing:1px;color:#687784}.comment p{line-height:1.5}.answer{border:1px solid #ccd8df;padding:6mm;margin-bottom:7mm}.answer b,.answers b{display:block;font-size:9px;color:#687784;letter-spacing:1px}.answer strong{font-size:18px}.answers{display:grid;grid-template-columns:1fr 1fr;gap:5mm;margin-bottom:7mm}.answers>div{border:1px solid #ccd8df;padding:5mm}.answers strong{display:block;margin-top:2mm}.photoGrid{display:grid;grid-template-columns:1fr 1fr;gap:5mm}.photoGrid figure{margin:0;border:1px solid #ccd8df;break-inside:avoid}.photoGrid img{display:block;width:100%;height:105mm;object-fit:contain;background:#f5f8fa}.photoGrid figcaption{padding:3mm;font-size:9px;font-weight:800}.sigs{display:grid;grid-template-columns:1fr 1fr;gap:8mm}.sigs img{display:block;width:100%;height:55mm;object-fit:contain;border:1px solid #ccd8df;margin-top:3mm}@media print{body{background:#fff}.page{margin:0;box-shadow:none}}</style></head><body>${pages.join('')}</body></html>`;const ov=document.createElement('div');ov.className='reportOverlay';ov.innerHTML=`<div class="reportBar"><button id="back">← Retour CRVT</button><b style="flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Aperçu — Compte rendu de visite technique</b><button id="print">🖨️ PDF</button></div><iframe class="reportFrame" sandbox="allow-same-origin allow-scripts"></iframe></div>`;document.body.appendChild(ov);const f=ov.querySelector('iframe');f.srcdoc=html;ov.querySelector('#back').onclick=()=>ov.remove();ov.querySelector('#print').onclick=()=>f.contentWindow.print()}
async function drawHistory(){await refreshHistory();const box=document.querySelector('#histList');if(!box)return;box.innerHTML=historyCache.slice().sort((a,b)=>b.id-a.id).map(a=>`<div class="historyItem"><div class="historyTop"><b>${esc(a.client||'Sans nom')}</b><span class="status ${a.status==='Terminé'?'done':''}">${esc(a.status)}</span></div><div class="muted">${fr(a.date)} · ${esc(a.auditeur||'Non renseigné')} · ${Object.values(a.photos||{}).reduce((n,v)=>n+v.length,0)} photo(s)</div><div class="row" style="margin-top:8px"><button class="btn secondary" data-open="${a.id}">Ouvrir</button><button class="btn secondary" data-dup="${a.id}">Dupliquer</button><button class="btn danger" data-delete="${a.id}">Supprimer</button></div></div>`).join('')||'<div class="empty">Aucun audit enregistré.</div>';box.querySelectorAll('[data-open]').forEach(b=>b.onclick=async()=>{audit=JSON.parse(JSON.stringify(historyCache.find(x=>x.id==b.dataset.open)));render();scrollTo(0,0)});box.querySelectorAll('[data-dup]').forEach(b=>b.onclick=async()=>{const s=historyCache.find(x=>x.id==b.dataset.dup);audit=JSON.parse(JSON.stringify(s));audit.id=Date.now();audit.client=(audit.client||'')+' (copie)';audit.status='Brouillon';await save();render()});box.querySelectorAll('[data-delete]').forEach(b=>b.onclick=async()=>{if(confirm('Supprimer cet audit ?')){await del(+b.dataset.delete);drawHistory()}})}async function exportBackup(){const a=await all();const blob=new Blob([JSON.stringify({app:'CRVT',audits:a})],{type:'application/json'});const u=URL.createObjectURL(blob),l=document.createElement('a');l.href=u;l.download='CRVT-sauvegarde.json';l.click();URL.revokeObjectURL(u)}
$('#newBtn').onclick=()=>{if(confirm('Créer un nouveau CRVT ?')){audit=fresh();render();scrollTo(0,0)}};$('#saveBtn').onclick=save;$('#reportBtn').onclick=report;async function start(){await refreshHistory();audit=historyCache.find(x=>x.status==='Brouillon')||fresh();render()}start();
