<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b6e9e">
<title>CRVT</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f1f5f9}
#appframe{position:fixed;inset:0;width:100%;height:100%;border:0;display:block;background:#f1f5f9}
</style>
</head>
<body>
<iframe id="appframe" src="CRVT_DERNIERE_VERSION_VALIDEe_index-1.html" title="CRVT"></iframe>
<script>
const frame=document.getElementById('appframe');
function installFix(){
  try{
    const d=frame.contentDocument;
    if(!d||!d.body)return;
    if(d.getElementById('crvt-annotation-fix'))return;
    const st=d.createElement('style');st.id='crvt-annotation-fix';
    st.textContent=`
      /* Annotation : le bandeau principal et la navigation ne doivent jamais recouvrir les outils */
      .modal.crvtAnnotationFix{
        position:fixed!important;inset:0!important;z-index:2147483647!important;
        width:100vw!important;height:100dvh!important;margin:0!important;padding:8px!important;
        overflow:hidden!important;background:rgba(0,0,0,.87)!important;
      }
      .modal.crvtAnnotationFix .modalbox{
        width:100%!important;height:100%!important;max-height:none!important;
        display:flex!important;flex-direction:column!important;gap:8px!important;
      }
      .modal.crvtAnnotationFix .tools{
        position:relative!important;z-index:2147483648!important;
        flex:0 0 auto!important;display:flex!important;flex-wrap:wrap!important;
        gap:6px!important;max-height:42vh!important;overflow-y:auto!important;
        padding:2px!important;background:#0000!important;
        -webkit-overflow-scrolling:touch!important;
      }
      .modal.crvtAnnotationFix .tools>*{position:relative!important;z-index:2147483649!important;pointer-events:auto!important;touch-action:manipulation!important;}
      .modal.crvtAnnotationFix .tools button{cursor:pointer!important;-webkit-tap-highlight-color:transparent!important;}
      .modal.crvtAnnotationFix .canvaswrap{position:relative!important;z-index:1!important;flex:1 1 auto!important;min-height:0!important;}
      .modal.crvtAnnotationFix .canvaswrap canvas{pointer-events:auto!important;touch-action:none!important;}
      body:has(.modal.crvtAnnotationFix)>header,
      body:has(.modal.crvtAnnotationFix)>#quickNav{visibility:hidden!important;pointer-events:none!important;}
    `;
    d.head.appendChild(st);
    const scan=()=>{
      d.querySelectorAll('.modal').forEach(m=>{
        if(m.querySelector('.tools'))m.classList.add('crvtAnnotationFix');
      });
    };
    scan();
    new MutationObserver(scan).observe(d.body,{subtree:true,childList:true});
  }catch(e){console.warn('CRVT annotation fix',e)}
}
frame.addEventListener('load',installFix);
</script>
</body>
</html>
