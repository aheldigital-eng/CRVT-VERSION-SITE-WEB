<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b6e9e"><link rel="manifest" href="./manifest.json"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><title>CRVT — Compte rendu de visite technique</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f1f5f9}iframe{display:block;width:100%;height:100%;border:0;background:#f1f5f9}</style></head><body><iframe id="crvt" src="./index.html?crvtfix=20" title="CRVT"></iframe><script>
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js',{scope:'./'}).catch(()=>{}));
const frame=document.getElementById('crvt');
function patchDelete(){try{const w=frame.contentWindow,d=frame.contentDocument;if(!w||!d)return false;if(typeof w.deleteAudit!=='function'||typeof w.idbDelete!=='function')return false;const native=w.deleteAudit;w.deleteAudit=async function(id){if(id==null||id==='')return;if(!confirm('Supprimer définitivement cet audit enregistré ?'))return;try{await w.idbDelete(id);if(Array.isArray(w.historyCache))w.historyCache=await w.idbAll();if(typeof w.history==='function')await w.history();if(typeof w.toast==='function')w.toast('Audit supprimé');}catch(e){console.error('CRVT suppression',e);if(typeof w.toast==='function')w.toast('Impossible de supprimer cet audit.')}};return true}catch(e){return false}}
frame.addEventListener('load',()=>{let n=0;const t=setInterval(()=>{if(patchDelete()||++n>80)clearInterval(t)},250)});
</script></body></html>
