<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b6e9e">
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>CRVT — Compte rendu de visite technique</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f1f5f9}iframe{display:block;width:100%;height:100%;border:0;background:#f1f5f9}</style>
</head>
<body>
<iframe id="crvt" src="./index-19.html" title="CRVT"></iframe>
<script>
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));}
const frame=document.getElementById('crvt');
function exposeTableauPhoto(){
  try{
    const d=frame.contentDocument;
    if(!d)return false;
    const labels=[...d.querySelectorAll('label')];
    const label=labels.find(x=>(x.textContent||'').includes('Place disponible dans le tableau'));
    if(!label)return false;
    const box=label.parentElement;
    const select=box&&box.querySelector('select');
    if(select && select.value!=='Oui'){
      select.value='Oui';
      select.dispatchEvent(new Event('input',{bubbles:true}));
      select.dispatchEvent(new Event('change',{bubbles:true}));
    }
    if(box)box.style.display='none';
    return true;
  }catch(e){return false;}
}
frame.addEventListener('load',()=>{
  let n=0;
  const t=setInterval(()=>{if(exposeTableauPhoto()||++n>40)clearInterval(t)},250);
});
</script>
</body>
</html>
