<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b6e9e">
<link rel="manifest" href="./manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>CRVT — Compte rendu de visite technique</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f1f5f9}iframe{display:block;width:100%;height:100%;border:0;background:#f1f5f9}</style>
</head>
<body>
<iframe id="crvt" src="./index.html?crvtfix=19" title="CRVT"></iframe>
<script>
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js',{scope:'./'}).catch(()=>{}));}
const frame=document.getElementById('crvt');
function patchHistoryButtons(){try{const w=frame.contentWindow,d=frame.contentDocument;if(!w||!d)return false;w.deleteAudit=async function(id){if(!confirm('Supprimer définitivement cet audit enregistré ?'))return;try{const req=w.indexedDB.open('auditTerrainV26DB',1);await new Promise((resolve,reject)=>{req.onerror=()=>reject(req.error||new Error('IndexedDB indisponible'));req.onsuccess=()=>{const db=req.result;if(!db.objectStoreNames.contains('audits')){db.close();reject(new Error('Store audits introuvable'));return}const tx=db.transaction('audits','readwrite');tx.objectStore('audits').delete(id);tx.oncomplete=()=>{db.close();resolve()};tx.onerror=()=>{db.close();reject(tx.error||new Error('Suppression impossible'))};tx.onabort=()=>{db.close();reject(tx.error||new Error('Suppression annulée'))}}});if(typeof w.history==='function')await w.history();if(typeof w.toast==='function')w.toast('Audit supprimé')}catch(e){if(typeof w.toast==='function')w.toast('Impossible de supprimer cet audit.')}};return true}catch(e){return false}}
function patchInformations(){try{const w=frame.contentWindow,d=frame.contentDocument;if(!w||!d||!w.audit)return false;if(d.getElementById('crvtExtraCableFields'))return true;const labels=[...d.querySelectorAll('label')];const pos=labels.find(x=>(x.textContent||'').trim()==='Positionnement de Borne');if(!pos||!pos.parentElement)return false;const host=pos.parentElement;const wrap=d.createElement('div');wrap.id='crvtExtraCableFields';wrap.className='grid full';wrap.style.marginTop='8px';wrap.innerHTML='<div><label>Distance (m)</label><input id="crvtDistance" type="number" min="0" step="0.1" inputmode="decimal" placeholder="Ex. 25"></div><div><label>Type de câble</label><select id="crvtTypeCable"><option value="">Sélectionner...</option><option value="3G10">3G10</option><option value="5G10">5G10</option></select></div><div class="full"><label>Câble de communication</label><select id="crvtCableComm"><option value="">Sélectionner...</option><option value="Oui">Oui</option><option value="Non">Non</option></select></div>';host.parentNode.insertBefore(wrap,host.nextSibling);const dist=d.getElementById('crvtDistance'),type=d.getElementById('crvtTypeCable'),comm=d.getElementById('crvtCableComm');dist.value=w.audit.data.longueurCable||w.audit.data.distance||'';type.value=w.audit.data.typeCable||'';comm.value=w.audit.data.cableCommunication||'';const save=async()=>{w.audit.data.longueurCable=dist.value;w.audit.data.typeCable=type.value;w.audit.data.cableCommunication=comm.value;w.audit.updatedAt=new Date().toISOString();try{if(typeof w.idbPut==='function')await w.idbPut(JSON.parse(JSON.stringify(w.audit)))}catch(e){}};dist.addEventListener('input',save);type.addEventListener('change',save);comm.addEventListener('change',save);return true}catch(e){return false}}
function patchCrop(){try{const w=frame.contentWindow,d=frame.contentDocument;if(!w||!d)return false;if(d.getElementById('crvtCropStyle'))return true;const st=d.createElement('style');st.id='crvtCropStyle';st.textContent='.crvtCropOverlay{position:fixed;inset:0;background:#0f172aee;z-index:3000;display:flex;flex-direction:column;padding:10px;box-sizing:border-box}.crvtCropTop{display:flex;justify-content:space-between;gap:8px;align-items:center;color:#fff;padding:5px}.crvtCropStage{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}.crvtCropStage img{max-width:100%;max-height:100%;object-fit:contain;user-select:none}.crvtCropBox{position:absolute;border:2px solid #fff;box-shadow:0 0 0 9999px #0008;touch-action:none;cursor:move}.crvtCropHandle{position:absolute;width:24px;height:24px;border:2px solid #fff;background:#0b6e9e;border-radius:50%;right:-13px;bottom:-13px;touch-action:none}.crvtCropActions{display:flex;gap:8px;padding:8px 0}.crvtCropActions button{flex:1;padding:12px;border:0;border-radius:10px;font-weight:800}.crvtCropCancel{background:#e2e8f0}.crvtCropOk{background:#0b6e9e;color:#fff}';d.head.appendChild(st);const orig=w.openPhotoEditor;w.openPhotoEditor=function(photo,index){if(!photo||!photo.data){return orig.apply(this,arguments)};const overlay=d.createElement('div');overlay.className='crvtCropOverlay';overlay.innerHTML='<div class="crvtCropTop"><b>✂️ Rogner la photo</b><button class="crvtCropCancel">Fermer</button></div><div class="crvtCropStage"><img id="crvtCropImg"><div class="crvtCropBox"><div class="crvtCropHandle"></div></div></div><div class="crvtCropActions"><button class="crvtCropCancel">Annuler</button><button class="crvtCropOk">✓ Valider le rognage</button></div>';d.body.appendChild(overlay);const img=overlay.querySelector('#crvtCropImg'),box=overlay.querySelector('.crvtCropBox'),handle=overlay.querySelector('.crvtCropHandle');img.src=photo.data;let x=.1,y=.1,s=.8;const sync=()=>{const sw=img.clientWidth,sh=img.clientHeight;box.style.left=(img.offsetLeft+x*sw)+'px';box.style.top=(img.offsetTop+y*sh)+'px';box.style.width=(s*sw)+'px';box.style.height=(s*sh)+'px'};setTimeout(sync,50);let mode=null,sx=0,sy=0,ox=0,oy=0,os=0;const point=e=>{const t=e.touches?e.touches[0]:e;return{x:t.clientX,y:t.clientY}};const start=(e,m)=>{e.preventDefault();mode=m;const p=point(e);sx=p.x;sy=p.y;ox=x;oy=y;os=s};const move=e=>{if(!mode)return;const p=point(e);const sw=img.clientWidth,sh=img.clientHeight;if(mode==='move'){x=Math.max(0,Math.min(.95,ox+(p.x-sx)/sw));y=Math.max(0,Math.min(.95,oy+(p.y-sy)/sh))}else{s=Math.max(.1,Math.min(1-Math.max(x,y),os+((p.x-sx)/sw+(p.y-sy)/sh)/2))}sync()};const end=()=>mode=null;box.addEventListener('pointerdown',e=>start(e,'move'));handle.addEventListener('pointerdown',e=>{e.stopPropagation();start(e,'size')});d.addEventListener('pointermove',move);d.addEventListener('pointerup',end);const close=()=>{overlay.remove();d.removeEventListener('pointermove',move);d.removeEventListener('pointerup',end)};overlay.querySelectorAll('.crvtCropCancel').forEach(b=>b.onclick=close);overlay.querySelector('.crvtCropOk').onclick=()=>{const canvas=d.createElement('canvas'),c=canvas.getContext('2d');const iw=img.naturalWidth,ih=img.naturalHeight;const sx0=x*iw,sy0=y*ih,sw=s*iw,sh=s*ih;canvas.width=Math.max(1,Math.round(sw));canvas.height=Math.max(1,Math.round(sh));c.drawImage(img,sx0,sy0,sw,sh,0,0,canvas.width,canvas.height);photo.data=canvas.toDataURL('image/jpeg',.92);photo.baseData=photo.data;if(typeof w.save==='function')w.save();if(typeof w.render==='function')w.render();close()};};return true}catch(e){console.warn('CRVT rognage',e);return false}}
frame.addEventListener('load',()=>{let n=0;const t=setInterval(()=>{const h=patchHistoryButtons(),i=patchInformations(),c=patchCrop();if((h&&i&&c)||++n>60)clearInterval(t)},250)});
</script>
</body>
</html>
