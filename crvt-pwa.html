<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b6e9e">
<link rel="manifest" href="./manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>CRVT — Compte rendu de visite technique</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f1f5f9}iframe{display:block;width:100%;height:100%;border:0;background:#f1f5f9}.crvtLockBanner{margin:10px 12px;padding:12px 14px;border:1px solid #bbf7d0;border-radius:12px;background:#f0fdf4;color:#166534;font-weight:800;font-size:14px}.crvtLockBanner small{display:block;margin-top:4px;color:#4b5563;font-weight:600}</style>
</head>
<body>
<iframe id="crvt" src="./index.html?crvtfix=18" title="CRVT"></iframe>
<script>
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js',{scope:'./'}).catch(()=>{}));}
const frame=document.getElementById('crvt');
function patchHistoryButtons(){try{const w=frame.contentWindow,d=frame.contentDocument;if(!w||!d)return false;w.deleteAudit=async function(id){if(!confirm('Supprimer définitivement cet audit enregistré ?'))return;try{const req=w.indexedDB.open('auditTerrainV26DB',1);await new Promise((resolve,reject)=>{req.onerror=()=>reject(req.error||new Error('IndexedDB indisponible'));req.onsuccess=()=>{const db=req.result;if(!db.objectStoreNames.contains('audits')){db.close();reject(new Error('Store audits introuvable'));return}const tx=db.transaction('audits','readwrite');tx.objectStore('audits').delete(id);tx.oncomplete=()=>{db.close();resolve()};tx.onerror=()=>{db.close();reject(tx.error||new Error('Suppression impossible'))};tx.onabort=()=>{db.close();reject(tx.error||new Error('Suppression annulée'))}}});if(typeof w.history==='function')await w.history();if(typeof w.toast==='function')w.toast('Audit supprimé')}catch(e){console.error('CRVT suppression audit',e);if(typeof w.toast==='function')w.toast('Impossible de supprimer cet audit.')}};return true}catch(e){return false}}
function patchAuditNames(){try{const w=frame.contentWindow,d=frame.contentDocument;if(!w||!d)return false;const cards=[...d.querySelectorAll('#hist .item')];if(!cards.length)return false;cards.forEach(card=>{const meta=card.querySelector('.historyMeta');const title=meta?.querySelector('b');const line=[...card.querySelectorAll('.smallMuted')].find(el=>(el.textContent||'').includes('Audit #'));if(!title||!line)return;const m=(line.textContent||'').match(/Audit #([0-9]+)/);if(!m)return;const suffix=m[1];const a=(w.historyCache||[]).find(x=>String(x.id).slice(-6)===suffix);if(!a)return;const donor=String(a.donneur||'').trim();const client=String(a.client||'').trim();if(donor||client){title.textContent=`CRVT ENSIO - ${donor||'Donneur d’ordre'} X ${client||'Client final'}`;title.setAttribute('title',title.textContent)}});return true}catch(e){console.warn('CRVT nom audit',e);return false}}
function patchTableau(){try{const w=frame.contentWindow,d=frame.contentDocument;if(!w||!d||!w.audit||!w.renderFollowups)return false;w.audit.data.place='Oui';w.renderFollowups();const labels=[...d.querySelectorAll('label')];const label=labels.find(x=>(x.textContent||'').includes('Place disponible dans le tableau'));if(label){const box=label.parentElement;if(box)box.style.display='none'}return !!d.querySelector('#tableauFollow .photoActions')}catch(e){return false}}
function patchInformations(){try{const w=frame.contentWindow,d=frame.contentDocument;if(!w||!d||!w.audit)return false;if(d.getElementById('crvtExtraCableFields'))return true;const labels=[...d.querySelectorAll('label')];const pos=labels.find(x=>(x.textContent||'').trim()==='Positionnement de Borne');if(!pos||!pos.parentElement)return false;const host=pos.parentElement;const wrap=d.createElement('div');wrap.id='crvtExtraCableFields';wrap.className='grid full';wrap.style.marginTop='8px';wrap.innerHTML=`<div><label>Distance (m)</label><input id="crvtDistance" type="number" min="0" step="0.1" inputmode="decimal" placeholder="Ex. 25"></div><div><label>Type de câble</label><select id="crvtTypeCable"><option value="">Sélectionner...</option><option value="3G10">3G10</option><option value="5G10">5G10</option></select></div><div class="full"><label>Câble de communication</label><select id="crvtCableComm"><option value="">Sélectionner...</option><option value="Oui">Oui</option><option value="Non">Non</option></select></div>`;host.parentNode.insertBefore(wrap,host.nextSibling);const dist=d.getElementById('crvtDistance'),type=d.getElementById('crvtTypeCable'),comm=d.getElementById('crvtCableComm');dist.value=w.audit.data.longueurCable||w.audit.data.distance||'';type.value=w.audit.data.typeCable||'';comm.value=w.audit.data.cableCommunication||'';const save=async()=>{w.audit.data.longueurCable=dist.value;w.audit.data.typeCable=type.value;w.audit.data.cableCommunication=comm.value;w.audit.updatedAt=new Date().toISOString();try{if(typeof w.idbPut==='function')await w.idbPut(JSON.parse(JSON.stringify(w.audit)))}catch(e){console.warn('CRVT sauvegarde champs câble',e)}};dist.addEventListener('input',save);type.addEventListener('change',save);comm.addEventListener('change',save);return true}catch(e){console.warn('CRVT champs Informations',e);return false}}
function patchLockTerminated(){try{const w=frame.contentWindow,d=frame.contentDocument;if(!w||!d||!w.audit)return false;const existing=d.getElementById('crvtLockBanner');if(w.audit.status!=='Terminé'){if(existing)existing.remove();return true}if(!existing){const banner=d.createElement('div');banner.id='crvtLockBanner';banner.className='crvtLockBanner';banner.innerHTML='🔒 Audit terminé — lecture seule<small>Pour modifier cet audit, utilise « Dupliquer » depuis l’historique afin de créer une nouvelle version.</small>';const first=d.querySelector('.wrap')||d.body;first.insertBefore(banner,first.firstChild)}const keep=['Retour','Partager','Ouvrir','Dupliquer','Supprimer','Imprimer','Enregistrer PDF','Vérifier','Rapport','Haut'];d.querySelectorAll('input,select,textarea,button').forEach(el=>{const txt=(el.textContent||'').trim();const aria=el.getAttribute('aria-label')||'';const ph=el.getAttribute('placeholder')||'';const allowed=keep.some(k=>txt.includes(k)||aria.includes(k)||ph.includes(k));if(!allowed){el.disabled=true;el.style.opacity='.6';el.style.cursor='not-allowed'}});return true}catch(e){console.warn('CRVT verrouillage',e);return false}}
let reportScaleObserver=null;function fitReportPreview(reportFrame){try{if(!reportFrame||!reportFrame.contentDocument)return;const d=reportFrame.contentDocument;const html=d.documentElement,body=d.body;if(!html||!body)return;const page=d.querySelector('.page,.reportPage');if(!page)return;const viewport=Math.max(1,reportFrame.clientWidth-2);const natural=Math.max(page.scrollWidth||0,page.getBoundingClientRect().width||0);if(!natural)return;const scale=Math.min(1,viewport/natural);body.style.transformOrigin='top left';body.style.transform='scale('+scale+')';body.style.width=(100/scale)+'%';body.style.minHeight=(100/scale)+'%';html.style.overflowX='hidden';html.style.overflowY='auto';html.style.background='#dfe6eb'}catch(e){}}
function watchReportOverlay(){try{const overlay=document.getElementById('crvtReportOverlay');if(!overlay)return false;const rf=overlay.querySelector('iframe');if(!rf)return false;const run=()=>setTimeout(()=>fitReportPreview(rf),60);rf.addEventListener('load',run,{once:false});run();if(reportScaleObserver)reportScaleObserver.disconnect();if(typeof ResizeObserver!=='undefined'){reportScaleObserver=new ResizeObserver(run);reportScaleObserver.observe(rf)}return true}catch(e){return false}}
frame.addEventListener('load',()=>{let n=0;const t=setInterval(()=>{const h=patchHistoryButtons();const p=patchTableau();const i=patchInformations();const a=patchAuditNames();const l=patchLockTerminated();watchReportOverlay();if((h&&p&&i&&a&&l)||++n>60)clearInterval(t)},250);try{const mo=new MutationObserver(()=>{patchInformations();patchAuditNames();patchLockTerminated();watchReportOverlay()});mo.observe(frame.contentDocument.body,{childList:true,subtree:true})}catch(e){}});
</script>
</body>
</html>
