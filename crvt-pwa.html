<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b6e9e">
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>CRVT — Compte rendu de visite technique</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f1f5f9}iframe{display:block;width:100%;height:100%;border:0;background:#f1f5f9}</style>
</head>
<body>
<iframe id="crvt" src="./index.html" title="CRVT"></iframe>
<script>
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));}
const frame=document.getElementById('crvt');
function patchHistoryButtons(){
  try{
    const w=frame.contentWindow,d=frame.contentDocument;
    if(!w||!d||!w.idbDelete||!w.idbAll||!w.history)return false;
    w.deleteAudit=async function(id){
      if(!confirm('Supprimer définitivement cet audit enregistré ?')) return;
      try{
        await w.idbDelete(id);
        if('historyCache' in w) w.historyCache=await w.idbAll();
        w.history();
        if(typeof w.toast==='function') w.toast('Audit supprimé');
      }catch(e){
        if(typeof w.toast==='function') w.toast('Impossible de supprimer cet audit.');
      }
    };
    return true;
  }catch(e){return false;}
}
function patchTableau(){
  try{
    const w=frame.contentWindow,d=frame.contentDocument;
    if(!w||!d||!w.audit||!w.renderFollowups)return false;
    w.audit.data.place='Oui';
    w.renderFollowups();
    const labels=[...d.querySelectorAll('label')];
    const label=labels.find(x=>(x.textContent||'').includes('Place disponible dans le tableau'));
    if(label){
      const box=label.parentElement;
      if(box)box.style.display='none';
    }
    return !!d.querySelector('#tableauFollow .photoActions');
  }catch(e){return false;}
}

// Le rapport est conçu en A4 (210 mm) pour l'impression.
// Sur téléphone, on le réduit uniquement à l'écran afin que toute la page
// soit visible. Le rendu PDF/Impression reste inchangé.
let reportScaleObserver=null;
function fitReportPreview(reportFrame){
  try{
    if(!reportFrame||!reportFrame.contentDocument)return;
    const d=reportFrame.contentDocument;
    const html=d.documentElement, body=d.body;
    if(!html||!body)return;
    const page=d.querySelector('.page,.reportPage');
    if(!page)return;
    const viewport=Math.max(1,reportFrame.clientWidth-2);
    const natural=Math.max(page.scrollWidth||0,page.getBoundingClientRect().width||0);
    if(!natural)return;
    const scale=Math.min(1,viewport/natural);
    body.style.transformOrigin='top left';
    body.style.transform='scale('+scale+')';
    body.style.width=(100/scale)+'%';
    body.style.minHeight=(100/scale)+'%';
    html.style.overflowX='hidden';
    html.style.overflowY='auto';
    html.style.background='#dfe6eb';
  }catch(e){}
}
function watchReportOverlay(){
  try{
    const overlay=document.getElementById('crvtReportOverlay');
    if(!overlay)return false;
    const rf=overlay.querySelector('iframe');
    if(!rf)return false;
    const run=()=>setTimeout(()=>fitReportPreview(rf),60);
    rf.addEventListener('load',run,{once:false});
    run();
    if(reportScaleObserver)reportScaleObserver.disconnect();
    reportScaleObserver=new ResizeObserver(run);
    reportScaleObserver.observe(rf);
    return true;
  }catch(e){return false;}
}

frame.addEventListener('load',()=>{
 let n=0;
 const t=setInterval(()=>{
   const h=patchHistoryButtons();
   const p=patchTableau();
   watchReportOverlay();
   if((h&&p)||++n>60)clearInterval(t);
 },250);
 try{
   const mo=new MutationObserver(()=>watchReportOverlay());
   mo.observe(frame.contentDocument.body,{childList:true,subtree:true});
 }catch(e){}
});
</script>
</body>
</html>
