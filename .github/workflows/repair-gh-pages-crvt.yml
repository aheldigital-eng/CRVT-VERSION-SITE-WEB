name: Repair CRVT gh-pages now

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deployed gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 1
          persist-credentials: true

      - name: Repair visible JavaScript without removing CRVT features
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # The broken build leaves the report-overlay JavaScript AFTER
          # </body></html>. Move that tail back inside a real script element.
          end_html = s.lower().find('</body></html>')
          if end_html >= 0:
              end = end_html + len('</body></html>')
              tail = s[end:]
              if 'const oldOverlay=document.getElementById("crvtReportOverlay")' in tail:
                  marker = 'const oldOverlay=document.getElementById("crvtReportOverlay")'
                  tail_js = tail[tail.find(marker):].strip()
                  s = s[:end_html] + '\n<script>\n' + tail_js + '\n</script></body></html>'

          # Also escape any literal closing script tag inside reportHtml.
          marker = 'const reportHtml=`'
          start = s.find(marker)
          if start >= 0:
              start += len(marker)
              end = s.find('`;\n// Affichage dans la même page', start)
              if end < 0:
                  end = s.find('`;\n', start)
              if end >= 0:
                  body = s[start:end]
                  body = body.replace('</script>', '<\\/script>').replace('</SCRIPT>', '<\\/script>')
                  s = s[:start] + body + s[end:]

          p.write_text(s, encoding='utf-8')
          print('CRVT script structure repaired.')

      - name: Ensure audit deletion repair is loaded
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="delete-fix.js?v=crvt-delete-9"></script>'
          if 'delete-fix.js?v=crvt-delete-9' not in s:
              pos = s.lower().rfind('</body>')
              if pos < 0:
                  raise SystemExit('Closing body tag not found')
              s = s[:pos] + '\n' + tag + '\n' + s[pos:]
              p.write_text(s, encoding='utf-8')

      - name: Publish repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if [ -f delete-fix.js ]; then git add delete-fix.js; fi
          if git diff --cached --quiet; then
            echo 'No CRVT changes required.'
            exit 0
          fi
          git commit -m 'Repair CRVT script structure and audit deletion'
          git push origin gh-pages
