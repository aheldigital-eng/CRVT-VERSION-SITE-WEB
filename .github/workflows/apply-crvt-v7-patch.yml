name: Apply CRVT V7 patch

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-gh-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: deployed

      - name: Apply safe CRVT patch
        run: |
          cp tools/patch_crvt.py /tmp/patch_crvt.py
          cd deployed
          python /tmp/patch_crvt.py

      - name: Commit and push gh-pages
        working-directory: deployed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to deploy."
          else
            git commit -m "Restore CRVT V7 information fields and annotation toolbar"
            git push origin gh-pages
          fi
