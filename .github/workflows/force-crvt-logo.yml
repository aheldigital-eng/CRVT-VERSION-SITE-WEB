name: Force CRVT logo on published site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  logo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout published site
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Patch published CRVT header and logo
        shell: bash
        run: |
          cat > crvt-logo.svg <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
            <defs>
              <linearGradient id="n" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#12395c"/><stop offset="1" stop-color="#071b31"/></linearGradient>
              <linearGradient id="o" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffad24"/><stop offset="1" stop-color="#ff5a00"/></linearGradient>
            </defs>
            <rect width="256" height="256" rx="48" fill="white"/>
            <path d="M36 103 128 38l92 65" fill="none" stroke="url(#n)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M57 100v92h43v-78h56v78h43v-92" fill="none" stroke="url(#n)" stroke-width="18" stroke-linejoin="round"/>
            <rect x="77" y="72" width="102" height="126" rx="12" fill="white" stroke="url(#n)" stroke-width="8"/>
            <rect x="107" y="61" width="42" height="22" rx="7" fill="url(#n)"/>
            <g fill="url(#o)"><rect x="92" y="96" width="19" height="19" rx="4"/><rect x="92" y="127" width="19" height="19" rx="4"/><rect x="92" y="158" width="19" height="19" rx="4"/></g>
            <g stroke="white" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="m96 105 5 5 8-10"/><path d="m96 136 5 5 8-10"/><path d="m96 167 5 5 8-10"/></g>
            <g fill="#9fb0bf"><rect x="120" y="99" width="44" height="6" rx="3"/><rect x="120" y="111" width="32" height="5" rx="2.5"/><rect x="120" y="130" width="44" height="6" rx="3"/><rect x="120" y="142" width="32" height="5" rx="2.5"/><rect x="120" y="161" width="44" height="6" rx="3"/><rect x="120" y="173" width="32" height="5" rx="2.5"/></g>
            <text x="128" y="229" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="39" font-weight="900" fill="url(#n)">CRV<tspan fill="url(#o)">T</tspan></text>
          </svg>
          SVG

          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          css='''<style id="crvt-logo-v2">.crvtBrandV2{display:flex;align-items:center;gap:11px;min-width:0}.crvtLogoV2{width:52px;height:52px;flex:0 0 52px;object-fit:contain;background:#fff;border-radius:13px;padding:3px;box-shadow:0 3px 12px #001f3a33}.crvtBrandTextV2{min-width:0}.crvtBrandTextV2 h1{margin:0;font-size:20px;line-height:1.12}.crvtBrandTextV2 .sub{margin-top:3px}@media(max-width:620px){.crvtLogoV2{width:46px;height:46px;flex-basis:46px}.crvtBrandTextV2 h1{font-size:17px}.crvtBrandTextV2 .sub{font-size:10px}}</style>'''
          if 'id="crvt-logo-v2"' not in s:
              s=s.replace('</head>',css+'</head>',1)
          header='<header><div class="crvtBrandV2"><img class="crvtLogoV2" src="crvt-logo.svg?v=2" alt="CRVT"><div class="crvtBrandTextV2"><h1>CRVT — Compte rendu de visite technique</h1><div class="sub">Audit technique • photos • annotations • légendes • sauvegarde • partage • rapport dynamique</div></div></div></header>'
          s,n=re.subn(r'<header>.*?</header>',header,s,count=1,flags=re.S)
          if n!=1:
              raise SystemExit('header introuvable dans index.html publié')
          p.write_text(s,encoding='utf-8')
          PY

      - name: Commit and publish with retry
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html crvt-logo.svg
          git diff --cached --quiet && exit 0
          git commit -m "Fix CRVT modern logo on published app"
          for i in 1 2 3 4 5; do
            git pull --rebase origin gh-pages && git push origin HEAD:gh-pages && exit 0
            git rebase --abort || true
            sleep 5
          done
          exit 1
