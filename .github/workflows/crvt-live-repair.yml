name: CRVT live repair

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout published gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Repair published CRVT HTML
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='id="crvt-live-repair-v1"'
          if marker in s:
              a=s.rfind('<script',0,s.find(marker))
              b=s.find('</script>',s.find(marker))
              if a>=0 and b>=0:
                  s=s[:a]+s[b+len('</script>'):]
          s=s.replace('\\n<script id="crvt-live-repair-v1">','')
          s=s.replace('\\n</script>\\n','')
          repair='''<script id="crvt-live-repair-v1">
          (function(){
            function cleanRawCode(){
              try{
                const w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT),nodes=[];let n;
                while(n=w.nextNode()){
                  const t=n.nodeValue||'';
                  if(/overlay=document\\.createElement|V13:\\s*barre de rapport|frame\\.setAttribute\\("sandbox"|crvtReportOverlay/.test(t)&&t.length>180)nodes.push(n);
                }
                nodes.forEach(n=>n.remove());
              }catch(e){}
            }
            function deleteById(id){return new Promise((resolve,reject)=>{const r=indexedDB.open('auditTerrainV26DB',1);r.onsuccess=()=>{const db=r.result;try{const tx=db.transaction('audits','readwrite');tx.objectStore('audits').delete(id);tx.oncomplete=()=>{try{db.close()}catch(e){};resolve(true)};tx.onerror=()=>reject(tx.error)}catch(e){reject(e)}};r.onerror=()=>reject(r.error)})}
            function install(){document.addEventListener('click',async function(ev){const b=ev.target.closest('button');if(!b||b.textContent.trim()!=='Supprimer')return;const m=(b.getAttribute('onclick')||'').match(/deleteAudit\\((\\d+)\\)/);if(!m)return;ev.preventDefault();ev.stopImmediatePropagation();if(!confirm('Supprimer définitivement cet audit enregistré ?'))return;try{await deleteById(Number(m[1]));if(typeof history==='function')await history();if(typeof toast==='function')toast('Audit supprimé')}catch(e){if(typeof toast==='function')toast('Impossible de supprimer cet audit.')}},true)}
            function run(){cleanRawCode();install();setTimeout(cleanRawCode,300);setTimeout(cleanRawCode,1200)}
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',run);else run();
          })();
          </script>
          '''
          if 'id="crvt-live-repair-v1"' not in s and '</body>' in s:s=s.replace('</body>',repair+'</body>',1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Publish repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Repair CRVT live page and audit deletion'
          git push origin gh-pages
