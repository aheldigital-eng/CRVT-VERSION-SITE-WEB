name: Make CRVT installable as PWA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pwa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout published gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add PWA files and registration
        shell: bash
        run: |
          cat > manifest.json <<'EOF'
          {
            "name": "CRVT — Compte rendu de visite technique",
            "short_name": "CRVT",
            "lang": "fr-FR",
            "start_url": "./",
            "scope": "./",
            "display": "standalone",
            "orientation": "portrait",
            "background_color": "#f1f5f9",
            "theme_color": "#0b6e9e",
            "description": "Compte rendu de visite technique CRVT.",
            "icons": [
              {"src":"icon-192.png","sizes":"192x192","type":"image/png","purpose":"any maskable"},
              {"src":"icon-512.png","sizes":"512x512","type":"image/png","purpose":"any maskable"}
            ]
          }
          EOF

          cat > sw.js <<'EOF'
          const CACHE = 'crvt-pwa-v2';
          const BASE = self.registration.scope;
          const CORE = [BASE, BASE + 'manifest.json'];

          self.addEventListener('install', event => {
            event.waitUntil(caches.open(CACHE).then(cache => cache.addAll(CORE)).then(() => self.skipWaiting()));
          });

          self.addEventListener('activate', event => {
            event.waitUntil(caches.keys().then(keys => Promise.all(keys.filter(k => k !== CACHE).map(k => caches.delete(k)))).then(() => self.clients.claim()));
          });

          self.addEventListener('fetch', event => {
            if (event.request.method !== 'GET') return;
            event.respondWith(fetch(event.request).then(response => {
              const copy = response.clone();
              caches.open(CACHE).then(cache => cache.put(event.request, copy)).catch(() => {});
              return response;
            }).catch(() => caches.match(event.request).then(r => r || caches.match(BASE))));
          });
          EOF

          if [ -f index.html ] && ! grep -q "crvt-pwa-registration" index.html; then
            python3 - <<'PY'
            from pathlib import Path
            p = Path('index.html')
            s = p.read_text(encoding='utf-8')
            marker = '</body>'
            block = "<!-- crvt-pwa-registration -->\n<script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}</script>\n"
            if marker in s:
                s = s.replace(marker, block + marker, 1)
                p.write_text(s, encoding='utf-8')
            PY
          fi

          # Generate valid 192x192 and 512x512 PNG icons with Python stdlib only.
          python3 - <<'PY'
          import struct, zlib, binascii

          def chunk(kind, data):
              return struct.pack('>I', len(data)) + kind + data + struct.pack('>I', binascii.crc32(kind + data) & 0xffffffff)

          def png(path, size):
              rows=[]
              for y in range(size):
                  row=bytearray([0])
                  for x in range(size):
                      # CRVT teal background with a simple white rounded-ish central mark.
                      margin=size//8
                      inside=(margin < x < size-margin and margin < y < size-margin)
                      if inside:
                          r,g,b=19,169,184
                      else:
                          r,g,b=11,110,158
                      row.extend((r,g,b))
                  rows.append(bytes(row))
              raw=zlib.compress(b''.join(rows),9)
              data=b'\x89PNG\r\n\x1a\n'
              data+=chunk(b'IHDR',struct.pack('>IIBBBBB',size,size,8,2,0,0,0))
              data+=chunk(b'IDAT',raw)
              data+=chunk(b'IEND',b'')
              open(path,'wb').write(data)

          png('icon-192.png',192)
          png('icon-512.png',512)
          PY

      - name: Publish PWA
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html manifest.json sw.js icon-192.png icon-512.png
          git diff --cached --quiet && exit 0
          git commit -m 'Deploy CRVT as installable PWA'
          git push origin gh-pages
