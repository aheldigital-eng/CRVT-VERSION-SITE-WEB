name: Deploy CRVT stable

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build CRVT from current deployed feature build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/crvt-deploy
          git show d9c3d05ac2fa13c89b2a69d3e214b3c444b9f419:index.html > /tmp/crvt-deploy/index.html
          cp delete-fix.js /tmp/crvt-deploy/delete-fix.js

          test -s /tmp/crvt-deploy/index.html
          test -s /tmp/crvt-deploy/delete-fix.js
          grep -q '^<!doctype html>' /tmp/crvt-deploy/index.html
          grep -q '</html>' /tmp/crvt-deploy/index.html
          grep -q 'function deleteAudit' /tmp/crvt-deploy/index.html

          # Repair the exact defect visible on the user's phone: the report
          # overlay JavaScript was left after </body></html>, so Chrome renders
          # it as text. Put that tail back inside a real script element.
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/crvt-deploy/index.html')
          s=p.read_text(encoding='utf-8')
          end_html=s.lower().find('</body></html>')
          if end_html>=0:
              end=end_html+len('</body></html>')
              tail=s[end:]
              marker='const oldOverlay=document.getElementById("crvtReportOverlay")'
              if marker in tail:
                  tail_js=tail[tail.find(marker):].strip()
                  s=s[:end_html]+'\n<script>\n'+tail_js+'\n</script></body></html>'

          # Also protect literal closing script tags inside reportHtml.
          marker='const reportHtml=`'
          start=s.find(marker)
          if start>=0:
              start+=len(marker)
              end=s.find('`;\n// Affichage dans la même page',start)
              if end<0: end=s.find('`;\n',start)
              if end>=0:
                  body=s[start:end]
                  body=body.replace('</script>','<\\/script>').replace('</SCRIPT>','<\\/script>')
                  s=s[:start]+body+s[end:]
          p.write_text(s,encoding='utf-8')
          PY

          # Load the robust audit deletion repair after the main CRVT script.
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/crvt-deploy/index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="delete-fix.js?v=crvt-delete-10"></script>'
          if 'delete-fix.js?v=crvt-delete-10' not in s:
              pos=s.lower().rfind('</body>')
              if pos<0: raise SystemExit('Closing body tag not found')
              s=s[:pos]+'\n'+tag+'\n'+s[pos:]
          p.write_text(s,encoding='utf-8')
          PY
          grep -q 'delete-fix.js?v=crvt-delete-10' /tmp/crvt-deploy/index.html

      - name: Prepare PWA files
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin gh-pages --depth=1 || true
          git show origin/gh-pages:crvt-icon-192.png > /tmp/crvt-deploy/crvt-icon-192.png 2>/dev/null || true
          git show origin/gh-pages:crvt-icon-512.png > /tmp/crvt-deploy/crvt-icon-512.png 2>/dev/null || true
          cat > /tmp/crvt-deploy/manifest.json <<'EOF'
          {"name":"CRVT — Compte rendu de visite technique","short_name":"CRVT","lang":"fr-FR","start_url":"./index.html?v=crvt-stable-10","scope":"./","display":"standalone","orientation":"portrait","background_color":"#f1f5f9","theme_color":"#0b6e9e","description":"Compte rendu de visite technique CRVT.","icons":[{"src":"crvt-icon-192.png?v=crvt-stable-10","sizes":"192x192","type":"image/png","purpose":"any"},{"src":"crvt-icon-512.png?v=crvt-stable-10","sizes":"512x512","type":"image/png","purpose":"maskable"}]}
          EOF

      - name: Publish stable CRVT to gh-pages
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin gh-pages:gh-pages
          git checkout gh-pages
          cp /tmp/crvt-deploy/index.html index.html
          cp /tmp/crvt-deploy/delete-fix.js delete-fix.js
          cp /tmp/crvt-deploy/manifest.json manifest.json
          rm -f sw.js crvt-logo.svg
          test ! -f /tmp/crvt-deploy/crvt-icon-192.png || cp /tmp/crvt-deploy/crvt-icon-192.png crvt-icon-192.png
          test ! -f /tmp/crvt-deploy/crvt-icon-512.png || cp /tmp/crvt-deploy/crvt-icon-512.png crvt-icon-512.png
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Fix CRVT visible code while preserving features'
          git push origin gh-pages
