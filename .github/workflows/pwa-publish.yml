name: Deploy CRVT stable

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore exact known-good pre-logo CRVT
        shell: bash
        run: |
          set -e
          mkdir -p /tmp/crvt-deploy
          git show f764b4afbdaafc0aeeb9ae818e701d5bcc114b9c:index.html > /tmp/crvt-deploy/index.html
          cp delete-fix.js /tmp/crvt-deploy/delete-fix.js
          test -s /tmp/crvt-deploy/index.html
          test -s /tmp/crvt-deploy/delete-fix.js
          grep -q '^<!doctype html>' /tmp/crvt-deploy/index.html
          grep -q '</html>' /tmp/crvt-deploy/index.html
          grep -q 'function deleteAudit' /tmp/crvt-deploy/index.html

          python3 - <<'PY'
          from pathlib import Path
          p = Path('/tmp/crvt-deploy/index.html')
          src = p.read_text(encoding='utf-8')

          # The report is stored in a JavaScript template literal. Any literal
          # </script> inside that template closes the OUTER script in Chrome,
          # which is exactly why the report-overlay code was being printed.
          start = src.find('const reportHtml=`')
          if start < 0:
              raise SystemExit('reportHtml template not found')
          end = src.find('`;\n// Affichage dans la même page', start)
          if end < 0:
              raise SystemExit('reportHtml template end not found')
          head = src[:start]
          body = src[start:end]
          tail = src[end:]
          body = body.replace('</script>', '<\\/script>')
          fixed = head + body + tail
          p.write_text(fixed, encoding='utf-8')
          PY

          python3 - <<'PY'
          from pathlib import Path
          p = Path('/tmp/crvt-deploy/index.html')
          src = p.read_text(encoding='utf-8')
          marker = '</body>'
          pos = src.lower().rfind(marker)
          if pos < 0:
              raise SystemExit('body closing marker not found')
          inject = '\n<script src="delete-fix.js?v=delete-fix-2"></script>\n'
          src = src[:pos] + inject + src[pos:]
          p.write_text(src, encoding='utf-8')
          PY

          grep -q 'delete-fix.js?v=delete-fix-2' /tmp/crvt-deploy/index.html
          grep -q '^<!doctype html>' /tmp/crvt-deploy/index.html
          grep -q '</html>' /tmp/crvt-deploy/index.html

      - name: Prepare PWA files
        shell: bash
        run: |
          set -e
          git fetch origin gh-pages --depth=1 || true
          git show origin/gh-pages:crvt-icon-192.png > /tmp/crvt-deploy/crvt-icon-192.png 2>/dev/null || true
          git show origin/gh-pages:crvt-icon-512.png > /tmp/crvt-deploy/crvt-icon-512.png 2>/dev/null || true
          cat > /tmp/crvt-deploy/manifest.json <<'EOF'
          {"name":"CRVT — Compte rendu de visite technique","short_name":"CRVT","lang":"fr-FR","start_url":"./index.html?v=crvt-fixed-5","scope":"./","display":"standalone","orientation":"portrait","background_color":"#f1f5f9","theme_color":"#0b6e9e","description":"Compte rendu de visite technique CRVT.","icons":[{"src":"crvt-icon-192.png?v=crvt-fixed-5","sizes":"192x192","type":"image/png","purpose":"any"},{"src":"crvt-icon-512.png?v=crvt-fixed-5","sizes":"512x512","type":"image/png","purpose":"maskable"}]}
          EOF

      - name: Publish exact known-good build to gh-pages
        shell: bash
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin gh-pages:gh-pages
          git checkout gh-pages
          cp /tmp/crvt-deploy/index.html index.html
          cp /tmp/crvt-deploy/delete-fix.js delete-fix.js
          cp /tmp/crvt-deploy/manifest.json manifest.json
          rm -f sw.js crvt-logo.svg
          test ! -f /tmp/crvt-deploy/crvt-icon-192.png || cp /tmp/crvt-deploy/crvt-icon-192.png crvt-icon-192.png
          test ! -f /tmp/crvt-deploy/crvt-icon-512.png || cp /tmp/crvt-deploy/crvt-icon-512.png crvt-icon-512.png
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Fix CRVT audit deletion'
          git push origin gh-pages