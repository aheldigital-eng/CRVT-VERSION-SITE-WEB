name: Deploy CRVT stable

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build stable CRVT from known-good source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/crvt-deploy
          git show f6337cfe0aa05e4bcf37194ae6bb67314246782f:index-19.html > /tmp/crvt-deploy/index.html
          cp delete-fix.js /tmp/crvt-deploy/delete-fix.js

          test -s /tmp/crvt-deploy/index.html
          test -s /tmp/crvt-deploy/delete-fix.js
          grep -q '^<!doctype html>' /tmp/crvt-deploy/index.html
          grep -q '</html>' /tmp/crvt-deploy/index.html
          grep -q 'function deleteAudit' /tmp/crvt-deploy/index.html

          # CRITICAL: reportHtml is a JavaScript template literal. A literal
          # </script> inside it terminates the outer script in Chrome and
          # exposes the following JavaScript as visible text.
          python3 - <<'PY'
          from pathlib import Path
          p = Path('/tmp/crvt-deploy/index.html')
          src = p.read_text(encoding='utf-8')
          start = src.find('const reportHtml=`')
          if start < 0:
              raise SystemExit('reportHtml template not found')
          end = src.find('`;\n// Affichage dans la même page', start)
          if end < 0:
              raise SystemExit('reportHtml template end not found')
          head = src[:start]
          body = src[start:end]
          tail = src[end:]
          body = body.replace('</script>', '<\\/script>').replace('</SCRIPT>', '<\\/script>')
          p.write_text(head + body + tail, encoding='utf-8')
          PY

          # Independent deletion repair, added after the report-template fix.
          python3 - <<'PY'
          from pathlib import Path
          p = Path('/tmp/crvt-deploy/index.html')
          src = p.read_text(encoding='utf-8')
          marker='</body>'
          pos=src.lower().rfind(marker)
          if pos < 0:
              raise SystemExit('Closing body tag not found')
          inject='\n<script src="delete-fix.js?v=crvt-delete-6"></script>\n'
          if 'delete-fix.js?v=crvt-delete-6' not in src:
              src=src[:pos]+inject+src[pos:]
          p.write_text(src, encoding='utf-8')
          PY
          grep -q 'delete-fix.js?v=crvt-delete-6' /tmp/crvt-deploy/index.html

      - name: Prepare PWA files
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin gh-pages --depth=1 || true
          git show origin/gh-pages:crvt-icon-192.png > /tmp/crvt-deploy/crvt-icon-192.png 2>/dev/null || true
          git show origin/gh-pages:crvt-icon-512.png > /tmp/crvt-deploy/crvt-icon-512.png 2>/dev/null || true
          cat > /tmp/crvt-deploy/manifest.json <<'EOF'
          {"name":"CRVT — Compte rendu de visite technique","short_name":"CRVT","lang":"fr-FR","start_url":"./index.html?v=crvt-stable-7","scope":"./","display":"standalone","orientation":"portrait","background_color":"#f1f5f9","theme_color":"#0b6e9e","description":"Compte rendu de visite technique CRVT.","icons":[{"src":"crvt-icon-192.png?v=crvt-stable-7","sizes":"192x192","type":"image/png","purpose":"any"},{"src":"crvt-icon-512.png?v=crvt-stable-7","sizes":"512x512","type":"image/png","purpose":"maskable"}]}
          EOF

      - name: Publish stable CRVT to gh-pages
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin gh-pages:gh-pages
          git checkout gh-pages
          cp /tmp/crvt-deploy/index.html index.html
          cp /tmp/crvt-deploy/delete-fix.js delete-fix.js
          cp /tmp/crvt-deploy/manifest.json manifest.json
          rm -f sw.js crvt-logo.svg
          test ! -f /tmp/crvt-deploy/crvt-icon-192.png || cp /tmp/crvt-deploy/crvt-icon-192.png crvt-icon-192.png
          test ! -f /tmp/crvt-deploy/crvt-icon-512.png || cp /tmp/crvt-deploy/crvt-icon-512.png crvt-icon-512.png
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Restore stable CRVT: fix script parsing and audit deletion'
          git push origin gh-pages
