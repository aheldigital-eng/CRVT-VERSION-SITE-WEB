name: Make CRVT installable as PWA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pwa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout published gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add PWA files and registration
        shell: bash
        run: |
          cat > manifest.json <<'EOF'
          {
            "name": "CRVT — Compte rendu de visite technique",
            "short_name": "CRVT",
            "lang": "fr-FR",
            "start_url": "./",
            "scope": "./",
            "display": "standalone",
            "orientation": "portrait",
            "background_color": "#f1f5f9",
            "theme_color": "#0b6e9e",
            "description": "Compte rendu de visite technique CRVT.",
            "icons": [
              {"src":"icon-192.png","sizes":"192x192","type":"image/png","purpose":"any maskable"},
              {"src":"icon-512.png","sizes":"512x512","type":"image/png","purpose":"any maskable"}
            ]
          }
          EOF

          cat > sw.js <<'EOF'
          const CACHE = 'crvt-pwa-v1';
          const BASE = self.registration.scope;
          const CORE = [BASE, BASE + 'manifest.json'];

          self.addEventListener('install', event => {
            event.waitUntil(caches.open(CACHE).then(cache => cache.addAll(CORE)).then(() => self.skipWaiting()));
          });

          self.addEventListener('activate', event => {
            event.waitUntil(caches.keys().then(keys => Promise.all(keys.filter(k => k !== CACHE).map(k => caches.delete(k)))).then(() => self.clients.claim()));
          });

          self.addEventListener('fetch', event => {
            if (event.request.method !== 'GET') return;
            event.respondWith(fetch(event.request).then(response => {
              const copy = response.clone();
              caches.open(CACHE).then(cache => cache.put(event.request, copy)).catch(() => {});
              return response;
            }).catch(() => caches.match(event.request).then(r => r || caches.match(BASE))));
          });
          EOF

          if [ -f index.html ] && ! grep -q "crvt-pwa-registration" index.html; then
            python3 - <<'PY'
            from pathlib import Path
            p = Path('index.html')
            s = p.read_text(encoding='utf-8')
            marker = '</body>'
            block = '''<!-- crvt-pwa-registration -->\n<script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}</script>\n'''
            if marker in s:
                s = s.replace(marker, block + marker, 1)
                p.write_text(s, encoding='utf-8')
            PY
          fi

          # Minimal generated icons, using SVG-free PNGs so Android can install the PWA.
          python3 - <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          for size, name in [(192,'icon-192.png'),(512,'icon-512.png')]:
              im = Image.new('RGB',(size,size),'#0b6e9e')
              d = ImageDraw.Draw(im)
              d.rounded_rectangle((size*.08,size*.08,size*.92,size*.92),radius=size*.12,fill='#13a9b8')
              try:
                  font=ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf',int(size*.28))
              except Exception:
                  font=None
              text='CRVT'
              box=d.textbbox((0,0),text,font=font)
              d.text(((size-(box[2]-box[0]))/2,(size-(box[3]-box[1]))/2-size*.03),text,fill='white',font=font)
              im.save(name)
          PY

      - name: Publish PWA
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html manifest.json sw.js icon-192.png icon-512.png
          git diff --cached --quiet && exit 0
          git commit -m 'Deploy CRVT as installable PWA'
          git push origin gh-pages
