name: Make CRVT installable as PWA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pwa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout published gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add PWA files
        run: |
          cat > manifest.json <<'EOF'
          {
            "name": "CRVT — Compte rendu de visite technique",
            "short_name": "CRVT",
            "lang": "fr-FR",
            "start_url": "./",
            "scope": "./",
            "display": "standalone",
            "orientation": "portrait",
            "background_color": "#f1f5f9",
            "theme_color": "#0b6e9e",
            "description": "Compte rendu de visite technique CRVT.",
            "icons": [
              {"src":"icon-192.png","sizes":"192x192","type":"image/png","purpose":"any maskable"},
              {"src":"icon-512.png","sizes":"512x512","type":"image/png","purpose":"any maskable"}
            ]
          }
          EOF

          cat > sw.js <<'EOF'
          const CACHE = 'crvt-pwa-v6';
          const BASE = self.registration.scope;
          self.addEventListener('install', event => {
            event.waitUntil(caches.open(CACHE).then(c => c.add(BASE)).then(() => self.skipWaiting()));
          });
          self.addEventListener('activate', event => {
            event.waitUntil(caches.keys().then(keys => Promise.all(keys.filter(k => k !== CACHE).map(k => caches.delete(k)))).then(() => self.clients.claim()));
          });
          self.addEventListener('fetch', event => {
            if (event.request.method !== 'GET') return;
            event.respondWith(fetch(event.request).then(response => {
              const copy = response.clone();
              caches.open(CACHE).then(c => c.put(event.request, copy)).catch(() => {});
              return response;
            }).catch(() => caches.match(event.request).then(r => r || caches.match(BASE))));
          });
          EOF

          python3 - <<'PY'
          from pathlib import Path
          import struct, zlib, binascii, re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Keep the previously validated CRVT fixes intact.
          s = s.replace('</style>\n</style>\n<style>\n/* V20 — outils pro terrain */', '</style>\n<style>\n/* V20 — outils pro terrain */', 1)
          s = s.replace('</style>\r\n</style>\r\n<style>\r\n/* V20 — outils pro terrain */', '</style>\r\n<style>\r\n/* V20 — outils pro terrain */', 1)

          # Add the requested Informations fields exactly once.
          if '"cablecom","Câble de communication"' not in s:
              needle = '["position","Positionnement de Borne","select:Sur mur|Sur pied|Autre"]'
              addition = ',["distance","Distance (m)","text"],["typeCable","Type de câble","select:3G10|5G10"],["cablecom","Câble de communication","select:Oui|Non"]'
              if needle in s:
                  s = s.replace(needle, needle + addition, 1)

          marker = '</body>'
          reg = "<!-- crvt-pwa-registration -->\n<script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}</script>\n"
          if 'crvt-pwa-registration' not in s and marker in s:
              s = s.replace(marker, reg + marker, 1)

          p.write_text(s, encoding='utf-8')

          def chunk(kind, data):
              return struct.pack('>I', len(data)) + kind + data + struct.pack('>I', binascii.crc32(kind + data) & 0xffffffff)

          def make_png(path, size):
              raw_rows=[]
              for y in range(size):
                  row=bytearray([0])
                  for x in range(size):
                      m=size//8
                      if m < x < size-m and m < y < size-m:
                          row.extend((19,169,184))
                      else:
                          row.extend((11,110,158))
                  raw_rows.append(bytes(row))
              raw=zlib.compress(b''.join(raw_rows),9)
              out=b'\x89PNG\r\n\x1a\n'
              out+=chunk(b'IHDR', struct.pack('>IIBBBBB', size, size, 8, 2, 0, 0, 0))
              out+=chunk(b'IDAT', raw)
              out+=chunk(b'IEND', b'')
              Path(path).write_bytes(out)

          make_png('icon-192.png', 192)
          make_png('icon-512.png', 512)
          PY

      - name: Publish PWA
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html manifest.json sw.js icon-192.png icon-512.png
          git diff --cached --quiet && exit 0
          git commit -m 'Add communication cable choice to CRVT'
          git push origin gh-pages
