name: Deploy CRVT stable

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore known working pre-logo CRVT
        shell: bash
        run: |
          set -e
          mkdir -p /tmp/crvt-deploy
          # This is the last known-good published CRVT build from before the logo work.
          git show f764b4afbdaafc0aeeb9ae818e701d5bcc114b9c:index.html > /tmp/crvt-deploy/index.html
          test -s /tmp/crvt-deploy/index.html
          grep -q '<!doctype html>' /tmp/crvt-deploy/index.html
          grep -q '</html>' /tmp/crvt-deploy/index.html
          grep -q 'function deleteAudit' /tmp/crvt-deploy/index.html

      - name: Prepare PWA files
        run: |
          set -e
          git fetch origin gh-pages --depth=1 || true
          git show origin/gh-pages:crvt-icon-192.png > /tmp/crvt-deploy/crvt-icon-192.png 2>/dev/null || true
          git show origin/gh-pages:crvt-icon-512.png > /tmp/crvt-deploy/crvt-icon-512.png 2>/dev/null || true
          cat > /tmp/crvt-deploy/manifest.json <<'EOF'
          {"name":"CRVT — Compte rendu de visite technique","short_name":"CRVT","lang":"fr-FR","start_url":"./index.html?v=prelogo-working-1","scope":"./","display":"standalone","orientation":"portrait","background_color":"#f1f5f9","theme_color":"#0b6e9e","description":"Compte rendu de visite technique CRVT.","icons":[{"src":"crvt-icon-192.png?v=prelogo-working-1","sizes":"192x192","type":"image/png","purpose":"any"},{"src":"crvt-icon-512.png?v=prelogo-working-1","sizes":"512x512","type":"image/png","purpose":"maskable"}]}
          EOF
          cat > /tmp/crvt-deploy/sw.js <<'EOF'
          const CACHE='crvt-prelogo-working-v1';
          const BASE=self.registration.scope;
          self.addEventListener('install',e=>e.waitUntil(caches.open(CACHE).then(c=>c.addAll([BASE,'index.html?v=prelogo-working-1','manifest.json'])).then(()=>self.skipWaiting())));
          self.addEventListener('activate',e=>e.waitUntil(caches.keys().then(k=>Promise.all(k.filter(x=>x!==CACHE).map(x=>caches.delete(x)))).then(()=>self.clients.claim())));
          self.addEventListener('fetch',e=>{if(e.request.method!=='GET')return;e.respondWith(fetch(e.request).then(r=>{const c=r.clone();caches.open(CACHE).then(x=>x.put(e.request,c)).catch(()=>{});return r}).catch(()=>caches.match(e.request).then(r=>r||caches.match(BASE))))});
          EOF

      - name: Publish to gh-pages
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin gh-pages:gh-pages || true
          git checkout gh-pages
          cp /tmp/crvt-deploy/index.html index.html
          cp /tmp/crvt-deploy/manifest.json manifest.json
          cp /tmp/crvt-deploy/sw.js sw.js
          test ! -f /tmp/crvt-deploy/crvt-icon-192.png || cp /tmp/crvt-deploy/crvt-icon-192.png crvt-icon-192.png
          test ! -f /tmp/crvt-deploy/crvt-icon-512.png || cp /tmp/crvt-deploy/crvt-icon-512.png crvt-icon-512.png
          rm -f crvt-logo.svg delete-fix.js
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Deploy known working CRVT pre-logo build'
          git push origin gh-pages
