name: Deploy stable CRVT

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish the known working pre-logo build
        shell: bash
        run: |
          test -f index-19.html
          git fetch origin gh-pages:gh-pages
          git worktree add /tmp/crvt-pages gh-pages
          cp index-19.html /tmp/crvt-pages/index.html
          rm -f /tmp/crvt-pages/sw.js
          cat > /tmp/crvt-pages/noop.txt <<'EOF'
CRVT stable pre-logo build
EOF
          cd /tmp/crvt-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js noop.txt
          git diff --cached --quiet || git commit -m "Restore stable CRVT pre-logo application"
          git push origin HEAD:gh-pages
