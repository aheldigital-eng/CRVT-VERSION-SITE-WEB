name: CRVT annotation toolbar fix

on:
  push:
    branches: [gh-pages]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 1
      - name: Patch annotation toolbar visibility
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          css_marker = '<style id="crvt-annotation-toolbar-fix-v1">'
          css = '''
<style id="crvt-annotation-toolbar-fix-v1">
/* CRVT V7 — toolbar annotations mobile : tous les outils restent accessibles. */
.modal .tools{
  display:flex !important;
  flex-wrap:wrap !important;
  gap:7px !important;
  max-height:50vh !important;
  overflow-y:auto !important;
  overflow-x:hidden !important;
  align-content:flex-start !important;
  align-items:flex-start !important;
  padding:4px 4px 8px !important;
  overscroll-behavior:contain !important;
  scrollbar-gutter:stable;
  -webkit-overflow-scrolling:touch;
}
.modal .tools .btn,.modal .tools label{
  min-height:42px !important;
  line-height:1.15 !important;
}
.modal .tools select{
  min-height:38px !important;
  font-size:14px !important;
}
@media(max-width:620px){
  .modal{padding:6px !important;}
  .modal .tools{max-height:48vh !important;gap:6px !important;padding:3px 3px 7px !important;}
  .modal .tools .btn,.modal .tools label{font-size:13px !important;padding:9px 10px !important;}
}
</style>
'''
          if css_marker not in s:
              s = s.replace('</head>', css + '</head>', 1)
          js_marker = '/* CRVT V7 — initialise la barre d’outils annotations en haut */'
          js = '''
/* CRVT V7 — initialise la barre d’outils annotations en haut */
(function(){
  try{
    const tools = m && m.querySelector ? m.querySelector('.tools') : null;
    if(tools){
      tools.scrollTop = 0;
      requestAnimationFrame(()=>{ tools.scrollTop = 0; });
      setTimeout(()=>{ tools.scrollTop = 0; }, 80);
    }
  }catch(e){}
})();
'''
          anchor = 'document.body.appendChild(m);\n\nlet c=m.querySelector("canvas")'
          if js_marker not in s and anchor in s:
              s = s.replace(anchor, 'document.body.appendChild(m);' + js + '\nlet c=m.querySelector("canvas")', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patched index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix CRVT annotation toolbar visibility on mobile"
          git push origin HEAD:gh-pages
