name: Finalize live CRVT

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Repair live CRVT"]
    types: [completed]

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout published gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Repair broken CRVT style blocks
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          fixes = [
              (
                  '@media print{body{padding-top:0 !important;}header{position:static !important;display:none !important;}#quickNav{display:none !important;}}\n\n<style id="crvt-v19-max-design">',
                  '@media print{body{padding-top:0 !important;}header{position:static !important;display:none !important;}#quickNav{display:none !important;}}\n</style>\n<style id="crvt-v19-max-design">'
              ),
              (
                  '@media print{body{background:#fff}.card{border:0;box-shadow:none}}\n<style id="crvt-v14-quicknav-fixed">',
                  '@media print{body{background:#fff}.card{border:0;box-shadow:none}}\n</style>\n<style id="crvt-v14-quicknav-fixed">'
              )
          ]
          changed = False
          for old, new in fixes:
              if old in s:
                  s = s.replace(old, new, 1)
                  changed = True
          if changed:
              p.write_text(s, encoding='utf-8')
              print('Repaired missing CRVT </style> closures.')
          else:
              print('No broken CRVT style block found.')

      - name: Restore CRVT application bootstrap
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<script id="crvt-boot-fix-v1">'
          if marker not in s:
              boot = '''<script id="crvt-boot-fix-v1">
(function(){
  function bootCRVT(){
    try{
      if(typeof migrateStorage === 'function'){
        Promise.resolve(migrateStorage()).then(function(){
          if(typeof render === 'function') render();
          if(typeof updatePdfThemeUI === 'function') updatePdfThemeUI();
        });
      }else if(typeof render === 'function'){
        render();
      }
    }catch(e){ console.error('CRVT bootstrap',e); }
  }
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded',bootCRVT,{once:true});
  else bootCRVT();
})();
</script>
'''
              s = s.replace('</body>', boot + '</body>', 1)
              p.write_text(s, encoding='utf-8')
              print('Restored CRVT application bootstrap.')
          else:
              print('CRVT bootstrap already present.')

      - name: Escape the live repair script closing tag
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<script id="crvt-live-repair-v1">'
          start = s.find(marker)
          if start >= 0:
              close = s.find('</script>', start + len(marker))
              if close >= 0:
                  s = s[:close] + '<\\/script>' + s[close + len('</script>'):]
                  p.write_text(s, encoding='utf-8')
                  print('Escaped crvt-live-repair-v1 closing tag.')
              else:
                  print('Closing tag not found after crvt-live-repair-v1.')
          else:
              print('crvt-live-repair-v1 marker not found; no change needed.')

      - name: Publish final repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Restore CRVT application bootstrap'
          for i in 1 2 3 4 5; do
            git pull --rebase origin gh-pages || true
            if git push origin gh-pages; then exit 0; fi
            sleep 3
          done
          exit 1
