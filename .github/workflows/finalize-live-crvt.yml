name: Finalize live CRVT

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Repair live CRVT"]
    types: [completed]

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout published gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Escape the live repair script closing tag
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<script id="crvt-live-repair-v1">'
          start = s.find(marker)
          if start >= 0:
              close = s.find('</script>', start + len(marker))
              if close >= 0:
                  s = s[:close] + '<\\/script>' + s[close + len('</script>'):]
                  p.write_text(s, encoding='utf-8')
                  print('Escaped crvt-live-repair-v1 closing tag.')
              else:
                  print('Closing tag not found after crvt-live-repair-v1.')
          else:
              print('crvt-live-repair-v1 marker not found; no change needed.')

      - name: Publish final repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix CRVT raw JavaScript rendering'
          for i in 1 2 3 4 5; do
            git pull --rebase origin gh-pages || true
            if git push origin gh-pages; then exit 0; fi
            sleep 3
          done
          exit 1
