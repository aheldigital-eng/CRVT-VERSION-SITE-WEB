name: Fix CRVT annotation toolbar

on:
  push:
    branches: [gh-pages]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 1

      - name: Fix annotation toolbar layout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '.tools{display:flex;gap:6px;flex-wrap:wrap;max-height:34vh;overflow-y:auto;padding-right:2px;align-content:flex-start}.tools .btn{flex:none}.tools select{flex:none;min-height:44px}.tools::-webkit-scrollbar{width:6px}.tools::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:99px}'
          new = '.tools{display:flex;gap:6px;flex-wrap:wrap;max-height:48vh;overflow-y:auto;padding:2px 4px 8px 2px;align-content:flex-start;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}.tools .btn{flex:none;min-height:44px}.tools select{flex:none;min-height:44px}.tools::-webkit-scrollbar{width:7px}.tools::-webkit-scrollbar-thumb{background:#94a3b8;border-radius:99px}.tools::-webkit-scrollbar-track{background:#e2e8f0;border-radius:99px}@media(max-width:620px){.modal{padding:6px}.modalbox{gap:6px}.tools{max-height:46vh;gap:5px;padding:2px 3px 8px 2px}.tools .btn{font-size:13px;padding:9px 10px;min-height:42px}.tools select{font-size:13px;min-height:42px}.canvaswrap{min-height:220px}.canvaswrap canvas{max-height:100%}}'
          if old not in s:
              print('Toolbar rule already fixed or source changed; no edit needed.')
          else:
              p.write_text(s.replace(old, new, 1), encoding='utf-8')
              print('Annotation toolbar rule updated.')
          PY

      - name: Commit fix
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix mobile annotation toolbar visibility"
          git push origin HEAD:gh-pages
