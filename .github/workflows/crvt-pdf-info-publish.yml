name: Deploy CRVT PDF info fix

on:
  workflow_run:
    workflows: ["Deploy CRVT stable"]
    types: [completed]

permissions:
  contents: write

jobs:
  deploy-pdf-info:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CRVT source
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Build PDF information fix and repair script structure
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/crvt-pdf
          mkdir -p /tmp/crvt-pdf
          git show f764b4afbdaafc0aeeb9ae818e701d5bcc114b9c:index.html > /tmp/crvt-pdf/index.html
          cp delete-fix.js /tmp/crvt-pdf/delete-fix.js
          cp tools/patch_report.py /tmp/crvt-pdf/patch_report.py
          cd /tmp/crvt-pdf
          python3 patch_report.py

          # The deployed build had report-overlay JavaScript after </body></html>.
          # Move that tail back inside a real script element so Chrome cannot
          # render the JavaScript source as page text.
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          end_html=s.lower().find('</body></html>')
          if end_html>=0:
              end=end_html+len('</body></html>')
              tail=s[end:]
              marker='const oldOverlay=document.getElementById("crvtReportOverlay")'
              if marker in tail:
                  tail_js=tail[tail.find(marker):].strip()
                  s=s[:end_html]+'\n<script>\n'+tail_js+'\n</script></body></html>'

          marker='const reportHtml=`'
          start=s.find(marker)
          if start>=0:
              start+=len(marker)
              end=s.find('`;\n// Affichage dans la même page',start)
              if end<0: end=s.find('`;\n',start)
              if end>=0:
                  body=s[start:end]
                  body=body.replace('</script>','<\\/script>').replace('</SCRIPT>','<\\/script>')
                  s=s[:start]+body+s[end:]
          p.write_text(s,encoding='utf-8')
          PY

          test -s index.html
          grep -q '^<!doctype html>' index.html
          grep -q 'Informations techniques' index.html
          grep -q 'Puissance souscrite' index.html
          grep -q 'Type de câble' index.html
          grep -q 'Câble de communication' index.html

      - name: Publish PDF information fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin gh-pages:gh-pages
          git checkout gh-pages
          cp /tmp/crvt-pdf/index.html index.html
          cp /tmp/crvt-pdf/delete-fix.js delete-fix.js
          cat > manifest.json <<'EOF'
          {"name":"CRVT — Compte rendu de visite technique","short_name":"CRVT","lang":"fr-FR","start_url":"./index.html?v=crvt-fixed-final","scope":"./","display":"standalone","orientation":"portrait","background_color":"#f1f5f9","theme_color":"#0b6e9e","description":"Compte rendu de visite technique CRVT."}
          EOF
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Finalize CRVT script structure and PDF information'
          git push origin gh-pages
