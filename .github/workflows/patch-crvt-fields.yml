name: Publish CRVT validated V7
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout published site
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Checkout patch tools
        uses: actions/checkout@v4
        with:
          ref: main
          path: source
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Repair published CRVT HTML and remove obsolete tableau references
        run: python source/tools/repair_pwa_and_tableau.py
      - name: Apply safe tableau-only correction
        run: python source/tools/patch_published_tableau.py
      - name: Publish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Repair CRVT page and preserve tableau photos'
          git push origin gh-pages
