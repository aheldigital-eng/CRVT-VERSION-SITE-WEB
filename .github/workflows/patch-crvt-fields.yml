name: Patch CRVT fields
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Checkout patch script
        uses: actions/checkout@v4
        with:
          ref: main
          path: patch-source
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch CRVT
        run: |
          python3 patch-source/tools/patch_report.py || true
          python3 patch-source/tools/fix_report_binding.py
      - name: Publish patched gh-pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix CRVT PDF preview and report controls'
          git push origin gh-pages
