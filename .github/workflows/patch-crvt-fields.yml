name: Publish CRVT validated V7
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout published site
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Checkout patch tools
        uses: actions/checkout@v4
        with:
          ref: main
          path: source
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Repair published CRVT HTML and remove obsolete tableau references
        run: python source/tools/repair_pwa_and_tableau.py
      - name: Escape report template script tags
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = 'const reportHtml=`'
          start = s.find(marker)
          if start < 0:
              raise SystemExit('reportHtml marker not found')
          start += len(marker)
          end = s.find('`;\n', start)
          if end < 0:
              raise SystemExit('reportHtml closing marker not found')
          body = s[start:end]
          fixed = body.replace('</script>', '<\\/script>')
          if fixed != body:
              p.write_text(s[:start] + fixed + s[end:], encoding='utf-8')
              print('Escaped inner </script> tags in reportHtml.')
          else:
              print('No inner </script> tags found.')
      - name: Apply safe tableau-only correction
        run: python source/tools/patch_published_tableau.py
      - name: Apply photo crop tool
        continue-on-error: true
        run: python source/tools/patch_crop.py
      - name: Apply crop preview split-screen V3
        continue-on-error: true
        run: python source/tools/patch_crop_preview_v3.py
      - name: Publish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix CRVT raw code rendering and publish'
          git fetch origin gh-pages
          git rebase origin/gh-pages
          git push origin gh-pages
