name: Publish CRVT validated V7
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout published site
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Checkout main source
        uses: actions/checkout@v4
        with:
          ref: main
          path: source
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore validated CRVT V7
        run: cp source/CRVT_DERNIERE_VERSION_VALIDEe_index-1.html index.html
      - name: Apply CRVT V7 information and annotation patch
        run: python source/tools/patch_crvt.py
      - name: Publish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Publish CRVT V7 with information and annotation fixes'
          git push origin gh-pages
