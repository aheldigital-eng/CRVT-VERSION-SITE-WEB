name: Publish CRVT validated V7
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout published site
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Checkout patch tools
        uses: actions/checkout@v4
        with:
          ref: main
          path: source
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Repair published CRVT HTML and remove obsolete tableau references
        run: python source/tools/repair_pwa_and_tableau.py
      - name: Fix report template closing script tag
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '})();\n</script>\n</body></html>`'
          new = '})();\n<\\/script>\n</body></html>`'
          if old in s:
              s = s.replace(old, new, 1)
              p.write_text(s, encoding='utf-8')
              print('Fixed the report template closing script tag.')
          else:
              print('Report template closing pattern already fixed or not found.')
      - name: Apply safe tableau-only correction
        run: python source/tools/patch_published_tableau.py
      - name: Apply photo crop tool
        continue-on-error: true
        run: python source/tools/patch_crop.py
      - name: Apply crop preview split-screen V3
        continue-on-error: true
        run: python source/tools/patch_crop_preview_v3.py
      - name: Publish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix CRVT report script parsing'
          git fetch origin gh-pages
          git rebase origin/gh-pages
          git push origin gh-pages
