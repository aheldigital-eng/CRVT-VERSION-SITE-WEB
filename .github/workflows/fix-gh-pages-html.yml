name: Fix CRVT gh-pages HTML

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  fix-gh-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 1
          persist-credentials: true

      - name: Escape script closing tags inside report template
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = 'const reportHtml=`'
          start = s.find(marker)
          if start < 0:
              raise SystemExit('reportHtml marker not found')
          start += len(marker)
          end = s.find('`;\n', start)
          if end < 0:
              raise SystemExit('reportHtml closing marker not found')
          before = s[:start]
          body = s[start:end]
          after = s[end:]
          body2 = body.replace('</script>', '<\\/script>')
          if body2 == body:
              print('No inner script closing tags found; nothing to change.')
          else:
              p.write_text(before + body2 + after, encoding='utf-8')
              print('Escaped inner report </script> tags.')

      - name: Commit and push repaired gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Fix raw JavaScript rendering in CRVT"
          git push origin gh-pages
